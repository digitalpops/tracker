  const k=S.settings.keys,list=KEY_ACTIONS.filter(a=>k[a[0]]);
  modal(`<h2>Keyboard Shortcuts</h2><div class="kb-list">${list.map(([id,l])=>`<div class="kb-row"><span class="kb-l">${l}</span><span class="kb-key">${keyLabel(k[id])}</span></div>`).join("")}
    ${S.settings.kbEnter?`<div class="kb-row"><span class="kb-l">Confirm a Pop-Up</span><span class="kb-key">Enter</span></div>`:""}
    ${S.settings.kbDelete?`<div class="kb-row"><span class="kb-l">Delete in a Pop-Up (Press Twice)</span><span class="kb-key">Backspace</span></div>`:""}
    ${S.settings.kbShiftEnter?`<div class="kb-row"><span class="kb-l">New Phase (Board)</span><span class="kb-key">Shift+Enter</span></div>`:""}
    <div class="kb-row"><span class="kb-l">Close a Pop-Up</span><span class="kb-key">Esc</span></div></div>
    <div class="m-actions"><button class="btn left" id="kh-edit">Edit Shortcuts</button><button class="btn primary" data-close>Close</button></div>`,root=>{root.querySelector("#kh-edit").onclick=()=>kbModal(()=>kbHelp())},"wide");
}
function runAction(id){
  const go=v=>{S.ui.view=v;commit()},nav=i=>{const b=document.querySelectorAll("#view .navg button")[i];if(b)b.click()};
  switch(id){
    case"viewBoard":return go("board");case"viewMonth":return go("month");case"viewWeek":return go("week");case"viewDay":return go("day");case"viewReview":return go("review");
    case"prev":return nav(0);case"today":return nav(1);case"next":return nav(2);
    case"newBlock":{if(S.ui.view==="day"){const b=document.querySelector("[data-addblock]");if(b)b.click()}else if(S.ui.view==="week"){const d=S.ui.day>=S.ui.week&&S.ui.day<=iso(addDays(parse(S.ui.week),6))?S.ui.day:S.ui.week;blockModal(null,d,540)}return}
    case"timerPause":{const b=document.getElementById("tm-pause");if(b)b.click();return}
    case"timerStop":{const b=document.getElementById("tm-stop");if(b)b.click();return}
    case"undo":return undoLast();case"projects":return libModal();case"settings":return settingsModal();
    case"theme":{const b=document.getElementById("btn-theme");if(b)b.click();return}
    case"sync":{if(Sync.connected()){toast("Syncing…");Sync.pull()}else Sync.connectScreen();return}
    case"help":return kbHelp();
    case"weeklyReview":S.ui.view="review";S.ui.rtab="weekly";S.ui.rweek=iso(weekOf(new Date()));return commit();
    case"monthlyReview":S.ui.view="review";S.ui.rtab="monthly";S.ui.month=TODAY().slice(0,7);return commit();
    case"editProject":return projectModal(proj().id,false);
    case"projectNotes":{const p=proj();return notesModal("project",p,p.name)}
    case"backup":return backupNow();
  }
}

/* ===================== modal + toast ===================== */
const effTheme=()=>S.ui.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function restoreTheme(){if(S.ui.theme)document.documentElement.setAttribute("data-theme",S.ui.theme);else document.documentElement.removeAttribute("data-theme")}
function closeModal(){document.getElementById("modal-root").innerHTML="";restoreTheme();applyPalette();applyAdv();Sync.afterModal()}
/* Back (Android swipe, mouse back button, Alt+Left, Cmd+[) closes a pop-up instead of leaving the app */
let histArmed=false;
addEventListener("popstate",()=>{if(vwPop){vwPop=false;return}if(VW){closeViewer(true);return}histArmed=false;if(document.getElementById("ov"))closeModal()});
function grow(t){if(!t||(!t.offsetParent&&!t.offsetHeight))return;t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px"}
document.addEventListener("input",e=>{if(e.target.matches&&e.target.matches("textarea.inp"))grow(e.target)});
const growAll=root=>requestAnimationFrame(()=>(root||document).querySelectorAll("textarea.inp").forEach(grow));
addEventListener("resize",()=>growAll());
document.addEventListener("toggle",e=>{if(e.target.tagName==="DETAILS")growAll(e.target)},true);
function modal(html,bind,cls=""){
  const root=document.getElementById("modal-root");
  root.innerHTML=`<div class="ov" id="ov"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  root.querySelector("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeModal()});
  root.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  bind&&bind(root);
  if(!histArmed){try{history.pushState({bbm:1},"");histArmed=true}catch(x){}}
  growAll(root);
}
function armDelete(btn,fn,armedText="Tap Again to Delete"){if(!btn)return;const orig=btn.textContent;let tm;
  btn.addEventListener("click",()=>{if(btn.classList.contains("armed")){clearTimeout(tm);fn()}else{btn.classList.add("armed");btn.textContent=armedText;clearTimeout(tm);tm=setTimeout(()=>{if(btn.isConnected&&btn.classList.contains("armed")){btn.classList.remove("armed");btn.textContent=orig}},3000)}})}
const undoSnap=()=>JSON.stringify({projects:S.projects,templates:S.templates,sessions:S.sessions,plans:S.plans,routineSkip:S.routineSkip,settings:S.settings,notes:S.notes,weekly:S.weekly,weekMeta:S.weekMeta,monthly:S.monthly,itemTemplates:S.itemTemplates,phaseTemplates:S.phaseTemplates,brand:S.brand});
let lastUndo=null;
function undoable(fn,msg){
  const before=undoSnap();
  fn();commit();
  const label=typeof msg==="function"?msg():msg,t=toast(label,6000);
  const run=()=>{if(lastUndo!==rec)return;lastUndo=null;Object.assign(S,JSON.parse(before));t.remove();applyPalette();applyAdv();commit();toast("Undone")};
  const rec={run,after:undoSnap(),label};lastUndo=rec;
  const u=document.createElement("button");u.className="undo";u.textContent="Undo";u.onclick=run;t.appendChild(u);
}
function undoLast(){
  if(!lastUndo)return toast("Nothing to undo");
  if(undoSnap()!==lastUndo.after){lastUndo=null;return toast("Can't undo: other changes were made since")}
  lastUndo.run();
}
let toastT;function toast(m,ms=2400){document.querySelector(".toast")?.remove();const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),ms);return t}

/* ===================== render + events ===================== */
let lastDay=null;
function render(){
  renderHeader();
  const v=document.getElementById("view"),V=S.ui.view;
  const keep=V==="week"?document.getElementById("wk-scroll")?.scrollLeft:null;
  const dkeep=V==="day"&&lastDay===S.ui.day?document.getElementById("day-scroll")?.scrollTop:null;lastDay=V==="day"?S.ui.day:null;
  v.className="v-"+V;
  const bk=dowIdx(new Date())===6&&S.settings.backupReminder!==false&&S.ui.bkDismiss!==TODAY()?`<div class="panel row bk"><span class="grow"><b>Sunday Backup</b> <span class="sub">Download a copy of your projects and templates to keep somewhere safe.</span></span><button class="btn sm primary" data-bk="dl">Download Backup</button><button class="btn sm ghost" data-bk="no">Not Now</button></div>`:"";
  v.innerHTML=bk+(V==="board"?viewBoard():V==="week"?viewWeek():V==="day"?viewDay():V==="month"?viewMonth():viewReview());
  if(V==="week"){const sc=document.getElementById("wk-scroll");if(keep!=null)sc.scrollLeft=keep;bindPinch()}
  if(V==="day"){const sc=document.getElementById("day-scroll"),n=sc.querySelector(".now");if(dkeep!=null)sc.scrollTop=dkeep;else if(n&&(S.ui.dzoom||1)>1)sc.scrollTop=Math.max(0,n.offsetTop-sc.clientHeight/3);bindDayPinch()}
  bindView(v);
  growAll(v);
}
function bindView(v){
  const mn=v.querySelector("#mn-notes");if(mn){let t;mn.oninput=()=>{monthRec(S.ui.month).notes=mn.value;v.querySelector("#mn-st").textContent="Saving…";clearTimeout(t);t=setTimeout(()=>{save();v.querySelector("#mn-st").textContent="Saved"},500)}}
  const pp=v.querySelector("#proj-pick");if(pp)pp.onchange=e=>{S.ui.project=e.target.value;commit()};
  const di=v.querySelector("#diary");if(di){let dt;di.oninput=()=>{S.notes[S.ui.day]=di.value;v.querySelector("#diary-st").textContent="Saving…";clearTimeout(dt);dt=setTimeout(()=>{save();v.querySelector("#diary-st").textContent="Saved"},600)}}
  v.querySelectorAll("[data-list]").forEach(L=>{const arr=S.weekMeta[S.ui.week][L.dataset.list==="pri"?"priorities":"achievements"];
    L.querySelectorAll("[data-li]").forEach(i=>i.oninput=()=>{arr[i.dataset.li]=i.value;save()});
    L.querySelectorAll("[data-lx]").forEach(b=>b.onclick=()=>{arr.splice(b.dataset.lx,1);commit()});
    L.querySelector("[data-ladd]").onclick=()=>{arr.push("");commit();const ins=document.querySelectorAll(`[data-list="${L.dataset.list}"] [data-li]`);ins[ins.length-1]?.focus()}});
  v.querySelectorAll("[data-wr]").forEach(t=>t.oninput=()=>{S.weekly[S.ui.rweek][t.dataset.wr]=t.value;save()});
  const mr=S.monthly[S.ui.month];
  if(S.ui.view==="review"&&S.ui.rtab==="monthly"&&mr){
    v.querySelector("#mr-focus").oninput=e=>{mr.focus=e.target.value;save()};
    v.querySelector("#mr-notes").oninput=e=>{mr.notes=e.target.value;save()};
    v.querySelectorAll("[data-mlist]").forEach(L=>{const arr=mr[L.dataset.mlist];
      L.querySelectorAll("[data-mi]").forEach(i=>i.oninput=()=>{arr[i.dataset.mi]=i.value;save()});
      L.querySelectorAll("[data-mx]").forEach(b=>b.onclick=()=>{arr.splice(b.dataset.mx,1);commit()});
      L.querySelector("[data-madd]").onclick=()=>{arr.push("");commit()}});
    v.querySelectorAll("[data-goal]").forEach(t=>t.oninput=()=>{mr.goals[t.dataset.goal][t.dataset.gk]=t.value;save()});
    v.querySelectorAll("[data-gx]").forEach(b=>b.onclick=()=>{mr.goals.splice(b.dataset.gx,1);commit()});
    v.querySelector("#goal-add").onclick=()=>{mr.goals.push({g:"",w:"",r:""});commit()};
  }
}
document.addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el||el.closest(".modal")||el.closest(".timer"))return;
  const d=el.dataset;
  if(d.view){S.ui.view=d.view;commit();return}
  if(d.togglePhase){if(e.shiftKey&&S.settings.kbShiftClick){const v=!S.ui.open[d.togglePhase];proj().phases.forEach(ph=>S.ui.open[ph.id]=v)}else S.ui.open[d.togglePhase]=!S.ui.open[d.togglePhase];commit();return}
  if(d.openItem)return itemModal(d.openItem);
  if(d.ses){const x=S.sessions.find(s=>s.id===d.ses),r=x&&IX.idx.step[x.step];if(r)return timeLogModal(x.step,r.it.id);return}
  if(d.editProj)return projectModal(d.editProj,false);
  if(d.notesProj){const p=S.projects.find(x=>x.id===d.notesProj);return notesModal("project",p,p.name)}
  if(d.notesPh){const r=IX.idx.phase[d.notesPh];return notesModal("phase",r.ph,r.ph.name)}
  if(d.hidedone){const r=IX.idx.phase[d.hidedone];r.ph.hideDone=!r.ph.hideDone;commit();return}
  if(d.rgrp){const r=IX.idx.phase[d.rgrp],old=d.g;return askText("Rename Row","Row Name",old,v=>{r.ph.items.forEach(x=>{if((x.group||"")===old)x.group=v});closeModal();commit();toast("Row renamed")})}
  if(d.rvExport)return reviewExportModal(d.rvExport);
  if(d.rounds)return roundsModal(d.rounds);
  if(d.creport)return clientReportModal(d.creport);
  if(d.openlib)return libModal();
  if(d.act==="add-phase")return phaseModal(null);
  if(d.act==="edit-phase")return phaseModal(d.ph);
  if(d.act==="add-item")return addItemModal(d.ph);
  if(d.wk!==undefined){S.ui.week=d.wk==="0"?iso(weekOf(new Date())):iso(addDays(parse(S.ui.week),+d.wk));commit();return}
  if(d.dzoom!==undefined){setDayZoom(d.dzoom==="0"?1:(S.ui.dzoom||1)*(d.dzoom==="1"?1.5:1/1.5));save();render();return}
  if(d.zoom!==undefined){setZoom(d.zoom==="0"?1:(S.ui.zoom||1)*(d.zoom==="1"?1.4:1/1.4));save();return}
  if(d.goday){S.ui.day=d.goday;S.ui.week=iso(weekOf(parse(d.goday)));S.ui.view="day";commit();return}
  if(d.dd!==undefined){S.ui.day=d.dd==="0"?TODAY():iso(addDays(parse(S.ui.day),+d.dd));S.ui.week=iso(weekOf(parse(S.ui.day)));commit();return}
  if(d.addblock)return blockModal(null,d.addblock,Math.min(Math.max(S.settings.dayStart*60,Math.ceil(nowMin()/15)*15),S.settings.dayEnd*60-60));
  if(d.mo!==undefined||d.mr!==undefined){const[y,m]=S.ui.month.split("-").map(Number),k=d.mo??d.mr;const n=k==="0"?new Date():new Date(y,m-1+(+k),1);S.ui.month=iso(n).slice(0,7);commit();return}
  if(d.skipe){const f=findEntry(d.skipe);if(f){const e=f.e,ds=S.ui.day;undoable(()=>{e.skip=e.skip||[];const i=e.skip.indexOf(ds);if(i<0)e.skip.push(ds);else e.skip.splice(i,1)},"Schedule updated")}return}
  if(d.bk){if(d.bk==="dl")backupNow();S.ui.bkDismiss=TODAY();commit();return}
  if(d.mshade){S.ui.mshade=d.mshade;commit();return}
  if(d.rtab){S.ui.rtab=d.rtab;commit();return}
  if(d.rw!==undefined){S.ui.rweek=d.rw==="0"?iso(weekOf(new Date())):iso(addDays(parse(S.ui.rweek),+d.rw));commit();return}
  if(d.rvWeek){S.ui.view="review";S.ui.rtab="weekly";S.ui.rweek=d.rvWeek;commit();return}
  if(d.rvMonth){S.ui.view="review";S.ui.rtab="monthly";commit();return}
  if(el.id==="btn-theme"){const dark=el.textContent==="Dark";S.ui.theme=dark?"dark":"light";document.documentElement.setAttribute("data-theme",S.ui.theme);save();renderHeader();return}
  if(el.id==="btn-lib")return libModal();
  if(el.id==="sync")return Sync.connected()?Sync.pull():Sync.connectScreen();
  if(el.id==="btn-settings")return settingsModal();
});
document.addEventListener("keydown",e=>{
  if(kbRecording||e.isComposing)return;
  const st=S.settings,t=e.target,ov=document.getElementById("ov"),mod=IS_APPLE?e.metaKey:e.ctrlKey;
  if(ov){
    if(e.key==="Escape"||(e.altKey&&e.key==="ArrowLeft")||(e.metaKey&&e.key==="[")){e.preventDefault();return closeModal()}
    if(e.key==="Enter"&&st.kbEnter&&!e.defaultPrevented&&!e.shiftKey&&!e.altKey){
      if(t&&(/^(BUTTON|A|SELECT)$/.test(t.tagName)||t.closest("form")))return;
      if(t&&t.tagName==="TEXTAREA"&&!mod)return;
      if(t&&t.tagName!=="TEXTAREA"&&mod)return;
      const btns=[...ov.querySelectorAll(".m-actions .btn.primary")].filter(b=>!b.disabled&&!b.hidden&&b.offsetParent);const b=btns[btns.length-1];
      if(b){e.preventDefault();b.click()}return}
    if((e.key==="Backspace"||e.key==="Delete")&&st.kbDelete&&!isField(t)&&!mod){
      const b=ov.querySelector(".m-actions .btn.danger");if(b&&b.offsetParent){e.preventDefault();b.click()}return}
    return}
  if(isField(t))return;
  if(e.key==="Enter"&&e.shiftKey&&st.kbShiftEnter&&S.ui.view==="board"&&!mod){e.preventDefault();return phaseModal(null)}
  const c=comboOf(e);if(!c)return;
  const id=Object.keys(st.keys||{}).find(k=>st.keys[k]===c);if(!id)return;
  if(id==="timerPause"&&!(T&&T.kind==="work"))return;
  e.preventDefault();runAction(id);
});
if(S.ui.theme)document.documentElement.setAttribute("data-theme",S.ui.theme);
applyPalette();
applyAdv();
render();
(()=>{const t=LS.get(K_T,null);if(t&&IX.idx.step[t.stepId]){T={...t,speed:1};clearInterval(tickT);tickT=setInterval(tick,250);document.body.classList.add("timing");drawTimer()}})();
IDB.get("sounds").then(v=>{if(v&&typeof v==="object"&&!Object.keys(S.sounds||{}).length)S.sounds=v;sndReady=true});
Sync.init();
if(!Sync.connected()){migrateColors();migrateFiles()}
setTimeout(()=>{runUploads();runTrash()},4000);
</script>
