<!doctype html>
<html lang="en">
<head>
<title>Blue Blaze Project Tracker</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#D7D7DB">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#19212F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Project Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Board (budget bars) is home; Week stacks day rows (plan above, logged time below) on a 5am–10pm axis; Day is one vertical column that fits the screen. */
:root{
  --bg:#D7D7DB; --surface:#FFFFFF; --stat:#EEF0F4; --btn:#FFFFFF; --tabbar:#EEF0F4; --tabsel:#FFFFFF; --field:#FFFFFF;
  --line:#DCDFE6; --line2:#C9CED8; --ink:#1A1F2B; --muted:#3F4657; --faint:#7D8496; --label:#3F4657;
  --accent:#006BC2; --accent-ink:#FFFFFF;
  --act:#38B2C3; --act-hi:#13707D; --left:#CFE1EC; --over:#FF52A6; --warn-bg:#FFDF00; --warn-fg:#FF52A6; --ok:#1E9C74; --amber:#C98200;
  --act-empty:#E2E6ED;
  --cal:#FFFFFF; --rvp:#FFFFFF; --bbg:#D7D7DB; --card:#FFFFFF; --warn:#EFD22F; --warn-tx:#E7C400; --tz:1;
  --rv-prev:#B6D6C5; --rv-goals:#E0BAD0; --stat-rv:#FFFFFF;
  --p1:#BFEBC2; --p2:#CBCDF7; --p3:#ADE2F4; --p4:#F4C0DE; --p5:#FAE5A6; --p6:#F6B9B2; --p7:#D6B6F4; --p8:#C7E6D6; --p9:#E3DED0;
  --lfm:#CEFBD0; --lfw:#FAF6B7; --lfe:#BEF5FC; --lfr:#DCE6E8;
  --blk-ink:#1A1F2B; --seg-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(26,31,43,.05),0 10px 28px rgba(26,31,43,.10);
  --overlay:rgba(20,24,34,.35);
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#19212F; --surface:#0B1324; --stat:#3E4D6F; --btn:#2E394E; --tabbar:#2E394E; --tabsel:#445170; --field:#333B4B;
  --line:#243049; --line2:#3A4763; --ink:#E9ECF2; --muted:#A5ADC0; --faint:#6E7891; --label:#A5ADC0;
  --accent:#4DA6F0; --accent-ink:#0B1324;
  --act:#38B2C3; --act-hi:#22F8FF; --left:#494E72; --over:#FF2E90; --ok:#3CC79A; --amber:#E6A93C;
  --act-empty:#23304F;
  --cal:#0B1324; --rvp:#0B1324; --bbg:#2B364A; --card:#1B1E25; --warn:#EFD22F; --warn-tx:#EFD22F;
  --rv-prev:#32575C; --rv-goals:#6B496B; --stat-rv:#3E4D6F;
  --p1:#3FAF62; --p2:#5B67EE; --p3:#2A9FD0; --p4:#D9468F; --p5:#C9961F; --p6:#E0563F; --p7:#9658E8; --p8:#2BA882; --p9:#8A826C;
  --lfm:#587A62; --lfw:#7A7851; --lfe:#3D6C8F; --lfr:#3D4B55;
  --blk-ink:#FFFFFF; --seg-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4); --overlay:rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#19212F; --surface:#0B1324; --stat:#3E4D6F; --btn:#2E394E; --tabbar:#2E394E; --tabsel:#445170; --field:#333B4B;
  --line:#243049; --line2:#3A4763; --ink:#E9ECF2; --muted:#A5ADC0; --faint:#6E7891; --label:#A5ADC0;
  --accent:#4DA6F0; --accent-ink:#0B1324;
  --act:#38B2C3; --act-hi:#22F8FF; --left:#494E72; --over:#FF2E90; --ok:#3CC79A; --amber:#E6A93C;
  --act-empty:#23304F;
  --cal:#0B1324; --rvp:#0B1324; --bbg:#2B364A; --card:#1B1E25; --warn:#EFD22F; --warn-tx:#EFD22F;
  --rv-prev:#32575C; --rv-goals:#6B496B; --stat-rv:#3E4D6F;
  --p1:#3FAF62; --p2:#5B67EE; --p3:#2A9FD0; --p4:#D9468F; --p5:#C9961F; --p6:#E0563F; --p7:#9658E8; --p8:#2BA882; --p9:#8A826C;
  --lfm:#587A62; --lfw:#7A7851; --lfe:#3D6C8F; --lfr:#3D4B55;
  --blk-ink:#FFFFFF; --seg-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4); --overlay:rgba(0,0,0,.55);
}
/* Board page keeps its own dark palette */
body.pg-board{--bg:var(--bbg);--surface:var(--card)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.pg-board{--act:#21B0C4;--left:#494E72;--over:#FF2E90}}
:root[data-theme="dark"] body.pg-board{--act:#21B0C4;--left:#494E72;--over:#FF2E90}
.sched-scroll,.dcol,.mgrid{--surface:var(--cal)}
.v-review .panel:not(.rv-prev):not(.rv-goals){--surface:var(--rvp)}
.wrap,.modal,.timer .in{zoom:var(--tz,1)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;padding-inline:16px;padding-block:0 40px}
body.timing{padding-bottom:120px}
.wrap{max-width:1200px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.a{color:var(--act);font-weight:700}
.v-week .num,.v-week .num .e,.v-week .tot b,.v-month .tot b{font-weight:700;color:var(--ink)}
.v-week .num .a,.v-week .tot .a{color:var(--act)}
.v-week .task .chip .num .a{color:var(--act-hi)}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{font-size:12.5px;color:var(--muted)}
.empty{color:var(--faint);font-size:13px;margin:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.row .grow{margin-right:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{border:1px solid var(--line2);background:var(--btn);padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--over);border-color:var(--over)}
.btn.danger.armed{background:var(--over);color:#fff}
.inp{border:1px solid var(--line2);background:var(--field);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{resize:none;overflow:hidden;line-height:1.55;min-height:64px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--stat);color:var(--muted)}
.chip.warn{background:var(--warn-bg);color:var(--warn-fg)}
.chip.over{background:var(--over);color:#fff}
.dot{width:10px;height:10px;border-radius:3px;flex:none;background:var(--c);display:inline-block}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{height:30px;width:auto;fill:var(--accent);flex:none}
.brand b{font-weight:800;font-size:16.5px;letter-spacing:-.01em}
.brand .tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent);padding:2px 7px;border-radius:5px}
.tabs{display:flex;gap:2px;background:var(--tabbar);padding:3px;border-radius:10px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--tabsel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.today{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:3px 11px 3px 4px;border:1px solid var(--line2);border-radius:999px;background:var(--btn)}
.today svg{width:26px;height:26px}
.iconbtn{border:1px solid var(--line2);background:var(--btn);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--ink)}
main{padding-top:20px;display:grid;gap:18px}

/* budget bars */
.proj-head{display:grid;gap:12px}
.proj-head .t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.proj-head .t b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.nums{font-size:12.5px;color:var(--muted)}
.nums b{color:var(--ink);font-weight:700}
.nums b.a{color:var(--act)}
.bar{position:relative;padding-right:18%;height:var(--h,22px)}
.bar .track{position:relative;height:100%;background:var(--left);border-radius:6px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--act);border-radius:6px 0 0 6px}
.bar .fill.full{border-radius:6px}
.bar .fill.is-over{background:var(--over);border-radius:6px 0 0 6px}
.bar .yel{position:absolute;top:0;bottom:0;background:var(--warn)}
.bar .yel.end{border-radius:0 6px 6px 0}
.bar.tint .track{background:color-mix(in srgb,var(--bc) 30%,var(--surface))}
.segbar .y{position:absolute;top:0;bottom:0;background:var(--warn)}
.segbox.tint .segbar{background:color-mix(in srgb,var(--bc) 30%,var(--surface))}
.segbox.tint .segbar .f:not(.over){background:var(--bc)}
.segbox.tint .segbar .lab{color:var(--blk-ink);text-shadow:none}
.pc{font-weight:800;margin-left:6px;font-size:.95em}
.pc.warn,.pct-w{color:var(--warn-tx);font-weight:800}
.pc.over,.pct-o{color:var(--over);font-weight:800}
.alerts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12.5px}
.alerts .k{font-size:12px;color:var(--label);font-weight:700;margin-right:4px}
.alerts .al{display:inline-flex;gap:6px;align-items:center;padding:2px 9px;border-radius:999px;background:var(--rvp);color:var(--ink);border:1px solid var(--line);font-weight:600}
.a.over,.nums b.a.over{color:var(--over)}
.segbar .f.over{background:var(--over)}
.bar .overf{position:absolute;left:100%;top:0;bottom:0;background:var(--over);border-radius:0 6px 6px 0}
.bar .est{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px;opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:10px;border-radius:3px;background:var(--c)}
.legend i.mark{width:2px;height:14px;background:var(--ink)}
.phases{display:grid;gap:10px}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.phase.bonus{border-style:dashed}
.ph-head{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:10px 22px;align-items:center;padding:14px 16px;cursor:pointer;width:100%;text-align:left;background:transparent;border:0}
.ph-name{display:grid;gap:2px;min-width:0}
.ph-name b{font-weight:700;display:flex;align-items:center;gap:8px}
.ph-name .caret{color:var(--faint);font-size:11px;transition:transform .15s}
.phase.open .caret{transform:rotate(90deg)}
.ph-bar{display:grid;gap:6px;min-width:0}
.bk{border-color:var(--accent)}
.late{color:var(--over);font-weight:700}
.ph-body{border-top:1px solid var(--line);padding:14px 16px 16px;display:grid;gap:14px}
.grp{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;align-items:start}
.grp-l{display:grid;gap:1px;padding-top:4px}
.grp-l b{font-size:13px}
.grp-l .num{font-size:12px;color:var(--muted)}
.segs{display:flex;gap:4px;padding-right:18%}
.segbox{flex:1 1 0;min-width:0;display:grid;gap:4px;border:0;background:transparent;padding:0;text-align:left}
.segbar{position:relative;height:30px;background:var(--left);border-radius:6px;overflow:hidden}
.segbar .f{position:absolute;left:0;top:0;bottom:0;background:var(--act)}
.segbar .o{position:absolute;right:0;top:0;bottom:0;background:var(--over)}
.segbar .lab{position:absolute;inset:0;display:flex;align-items:center;padding:0 8px;font-weight:700;font-size:12.5px;color:var(--seg-ink);text-shadow:0 1px 1px rgba(0,0,0,.18)}
.segbox:hover .segbar{outline:2px solid var(--accent);outline-offset:1px}
.segbox .m{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--sc)}
@media (max-width:700px){.ph-head{grid-template-columns:1fr}.grp{grid-template-columns:1fr}.segs{padding-right:0}}

/* item modal */
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--stat);border-radius:10px;padding:10px 12px}
.step .nm{font-weight:700}
.step .nm .num{font-weight:500;font-size:12.5px;color:var(--muted);margin-left:6px}
.step .stg{font-size:12px;color:var(--muted)}
.step .mini{grid-column:1/-1;--h:8px}
.step .acts{display:flex;gap:6px}
.status-row{display:flex;flex-wrap:wrap;gap:6px}
.status-row button{border:1px solid var(--line2);background:var(--btn);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.status-row button[aria-pressed="true"]{border-color:var(--sc);color:var(--ink);background:color-mix(in srgb,var(--sc) 22%,var(--surface))}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13.5px}
.check input{margin-top:3px;accent-color:var(--accent)}
.check.done span{color:var(--faint)}
.fb{display:grid;gap:2px;border-left:3px solid var(--accent);padding:4px 10px}
.fb .d{font-size:11.5px;color:var(--muted)}

/* week rows */
.zoombar{display:flex;align-items:center;gap:4px}
.sched-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.sched{display:grid}
.srow{display:grid;grid-template-columns:96px 1fr;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.slab{position:sticky;left:0;z-index:4;background:var(--surface);border:0;border-right:1px solid var(--line);padding:8px 10px;display:grid;align-content:center;gap:1px;text-align:left}
button.slab:hover b{color:var(--accent)}
.slab b{font-size:13.5px;font-weight:800;letter-spacing:.02em}
.slab b span{font-weight:500;color:var(--muted)}
.slab .h{font-size:11.5px;color:var(--muted)}
.srow.is-today .slab b{color:var(--accent)}
.hours-h{position:relative;height:26px}
.hours-h span{position:absolute;top:5px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);font-weight:600}
.lane{position:relative;height:calc(6px + var(--ph,38px) + 3px + var(--ah,7px));cursor:copy}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}
.gl.half{background:color-mix(in srgb,var(--line) 45%,transparent)}
.lane .ab{position:absolute;left:0;right:0;bottom:0;height:var(--ah,7px);background:var(--act-empty);pointer-events:none}
.blk{position:absolute;top:6px;height:var(--ph,38px);border-radius:7px;background:var(--c);color:var(--blk-ink);font-size:12px;font-weight:700;padding:0 8px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;cursor:pointer;user-select:none;border:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.blk.life{font-weight:500;font-style:italic}
.blk.sched,.vblk.sched{font-style:normal;font-weight:700;border:2px dashed color-mix(in srgb,var(--c) 70%,var(--ink));background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--ink)}
.blk.sched .rz,.vblk.sched .rz{display:none}
.blk,.vblk{-webkit-touch-callout:none;-webkit-user-select:none}
.blk .rz{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize}
.blk.drag,.vblk.drag{box-shadow:0 0 0 2px var(--accent),var(--shadow);z-index:6;cursor:grabbing;transform:scale(1.03)}
.lane.drop{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.blk .du{font-weight:500;font-size:10.5px;opacity:.8}
.act{position:absolute;bottom:0;height:var(--ah,7px);background:var(--act);border-radius:2px;pointer-events:none}
.now{position:absolute;background:var(--over);pointer-events:none;z-index:3}
.lane .now{top:0;bottom:0;width:2px}
.wk-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.wk-col{display:grid;gap:18px;min-width:0}
@media (max-width:860px){.wk-grid{grid-template-columns:1fr}}
.hrow{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;font-size:13px}
.hrow .l{display:flex;align-items:center;gap:8px;min-width:0}
.hrow .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .v{text-align:right;font-size:12.5px}
.htrack{height:10px;background:var(--stat);border-radius:5px;overflow:hidden;position:relative}
.htrack .pl{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.75}
.htrack .ac{position:absolute;left:0;bottom:0;height:4px;background:var(--act)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.task:first-child{border-top:0}
.task b{font-weight:700}
.task .chip{color:var(--ink);background:color-mix(in srgb,var(--sc) 18%,var(--surface))}
.task .chip .a{color:var(--act-hi)}
.list-ed{display:grid;gap:6px}
.list-ed .li{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center}
.list-ed .n{font-size:12px;color:var(--faint);text-align:right}

/* day (vertical) */
.day-grid{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:18px;align-items:start}
@media (max-width:820px){.day-grid{grid-template-columns:1fr}}
.dcol{height:clamp(440px,calc(100dvh - 290px),980px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:hidden;overflow-y:auto;touch-action:pan-x pan-y;overscroll-behavior-y:contain}
.dinner{display:grid;grid-template-columns:46px 1fr 16px;min-height:100%}
body.timing .dcol{height:clamp(440px,calc(100dvh - 390px),980px)}
.dtimes{position:relative;border-right:1px solid var(--line)}
.dtimes span{position:absolute;right:6px;transform:translateY(-50%);font-size:10.5px;font-weight:600;color:var(--muted)}
.dtimes span:first-child{transform:none}
.vlane{position:relative;cursor:copy}
.vlane .hl{position:absolute;left:0;right:0;height:1px;background:var(--line);pointer-events:none}
.vlane .hl.half{background:color-mix(in srgb,var(--line) 45%,transparent)}
.vblk{position:absolute;left:6px;right:6px;border-radius:5px;background:var(--c);color:var(--blk-ink);font-size:11px;font-weight:700;padding:0 6px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;cursor:grab;user-select:none;border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);line-height:1.15}
.vblk.life{font-weight:500;font-style:italic}
.vblk .du{font-weight:500;font-size:10px;opacity:.8}
.vblk .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.vact{position:relative;background:var(--act-empty);border-left:1px solid var(--line)}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.mcell.out{background:color-mix(in srgb,var(--stat) 45%,var(--surface));color:var(--faint)}
.mcell .dn{font-weight:700;font-size:13px}
.mtop{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
.mcell.ph .hrs{color:var(--ink)}
.mcell.is-today .dn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink)}
.mcell .hrs{font-size:13px;font-weight:700;color:var(--act);line-height:24px}
.mk{display:flex;flex-wrap:wrap;gap:3px}
.mk span{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--btn);border:1px solid var(--line2);color:var(--muted)}
.mk span{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 18%,var(--surface));max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk span.due{border-style:dashed}
@media (max-width:640px){.mcell{min-height:70px;padding:4px}.mcell .hrs{font-size:11px}.mk span{font-size:9px;padding:0 3px}.mgrid .hd{padding:6px 4px;font-size:10px;letter-spacing:.02em}}

/* review */
.rv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.rv-grid{grid-template-columns:1fr}}
.goals{display:grid;gap:8px}

.goal-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:760px){.goal,.goal-h{grid-template-columns:22px 1fr auto}.goal .why,.goal .rw,.goal-h .why,.goal-h .rw{grid-column:2}}
.rv-prev{background:var(--rv-prev);border-color:transparent}
.rv-goals{background:var(--rv-goals);border-color:transparent}
.field{display:grid;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--label);letter-spacing:.03em}

/* weekly schedule editor */
.sched-ed{display:grid;gap:8px}
.se{display:grid;gap:8px;background:var(--stat);border-radius:10px;padding:10px}

.se-dur{display:flex;align-items:center;gap:6px}.se-dur .inp{width:80px}

/* time log */
.log{display:grid;gap:6px}
.log-row{display:grid;grid-template-columns:1.3fr 1fr 80px auto auto;gap:8px;align-items:center}

/* palette editor */
.pal{display:grid;gap:6px}

.pal-grip{display:grid;place-items:center;height:38px;border-radius:8px;color:var(--faint);font-size:18px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.pal-grip:hover{background:var(--stat);color:var(--ink)}
.pal-row.dragging{opacity:.75}.pal-row.dragging .pal-grip{background:var(--accent);color:var(--accent-ink);cursor:grabbing}
#pal-rows.is-drag{user-select:none;-webkit-user-select:none}
.pal-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pal-n{font-size:12px;color:var(--faint);text-align:right}
.pal-c{display:flex;align-items:center;gap:10px;padding:5px;border-radius:9px;background:#F3F4F7;border:2px solid transparent;color:#1A1F2B;text-align:left}
.pal-c.dk{background:#0B1324;color:#E9ECF2}
.pal-c[aria-pressed="true"]{border-color:var(--accent)}
.pal-sw{width:34px;height:28px;border-radius:7px;border:1px solid rgba(0,0,0,.15);flex:none}
.pal-hx{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.hsv{display:grid;gap:10px;background:var(--stat);border-radius:12px;padding:12px}
.hsv-prev{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;background:#FFFFFF;color:#1A1F2B}
.hsv-prev.dk{background:#0B1324;color:#E9ECF2}
.hsv-prev span{width:64px;height:40px;border-radius:8px;border:1px solid rgba(0,0,0,.15)}
.hsv-sl{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px}
.hsv-sl label{font-size:12px;font-weight:700;color:var(--label)}
.hsv-sl label span{font-weight:500;color:var(--muted);margin-left:4px}
input.hr{-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;border:1px solid var(--line2);width:100%}
input.hr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #1A1F2B;box-shadow:0 1px 3px rgba(0,0,0,.35)}
input.hr::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #1A1F2B}
@media (max-width:560px){.hsv-sl{grid-template-columns:1fr}}

/* modal */
.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:14px}
.modal.wide{width:min(720px,100%)}
.modal h2{font-size:19px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.m-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

.swatches{display:grid;grid-template-columns:repeat(12,minmax(0,34px));gap:6px}
.swatches button{aspect-ratio:1;width:100%;border-radius:8px;border:2px solid transparent;background:var(--c);color:var(--blk-ink);font-size:10.5px;font-weight:700;padding:0;display:grid;place-items:center}

.seg-ctl{display:flex;background:var(--tabbar);padding:3px;border-radius:9px;gap:2px}
.seg-ctl button{flex:1;white-space:nowrap;border:0;background:transparent;border-radius:7px;padding:5px 12px;font-weight:600;color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--tabsel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tpl{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.tpl:first-of-type{border-top:0}

/* round 2 */
.navg{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap}
.ndot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--act);vertical-align:2px;margin-left:5px}
.grp-name{border:0;background:none;padding:0;text-align:left;font:inherit;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer}
.grp-name:hover{text-decoration:underline}
.title-inp{font-size:19px;font-weight:800;letter-spacing:-.01em;border-color:transparent;background:transparent;padding:3px 6px;margin-left:-7px}
.title-inp:hover,.title-inp:focus{border-color:var(--line2);background:var(--field)}
.nt-links{display:grid;gap:4px;overflow-wrap:anywhere;font-size:13px}
.nt-links a{color:var(--accent)}
details.sec{border:1px solid var(--line);border-radius:10px;padding:0 12px}
details.sec>summary{cursor:pointer;padding:10px 0;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--label);list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}

details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec[open]{padding-bottom:12px}
.ord{display:grid;gap:10px}
.ord-g{display:grid;gap:6px;background:var(--stat);border-radius:10px;padding:8px}
.ord-h,.ord-i{display:flex;align-items:center;gap:6px}
.ord-h .inp{font-weight:700;flex:1;min-width:0}
.ord-i{padding-left:10px;font-size:13.5px}
.ord-i .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord-i select{width:auto;max-width:44%}
.ar{border:1px solid var(--line2);background:var(--btn);border-radius:7px;width:30px;height:28px;padding:0;font-size:11px;color:var(--ink);flex:none}
.ar:disabled{opacity:.3}
.step .acts .ar{height:26px;width:26px}

@media print{body.printing>*:not(#print-root){display:none!important}body.printing{background:#fff;padding:0}body.printing #print-root{display:block;color:#111;font-family:var(--sans)}}
.pr h1{font-size:22px;margin:0 0 4px}.pr .sub{color:#555;font-size:12px}.pr h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:18px 0 6px;color:#333}
.pr .st{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px}.pr .st b{font-size:16px}
.pr p,.pr li{white-space:pre-wrap;font-size:13px;line-height:1.5;margin:0 0 4px}.pr table{border-collapse:collapse;width:100%;font-size:12.5px}.pr td,.pr th{border:1px solid #ccc;padding:6px;text-align:left;vertical-align:top;white-space:pre-wrap}

/* keyboard */
.kb-list{display:grid;gap:4px}
.kb-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
.kb-row:first-child{border-top:0}
.kb-l{flex:1;min-width:0;font-size:13.5px}
.kb-key{min-width:96px;border:1px solid var(--line2);background:var(--btn);border-radius:7px;padding:4px 10px;font-size:12.5px;font-weight:700;color:var(--ink);text-align:center;white-space:nowrap}
.kb-key.empty{color:var(--faint);font-weight:600;font-style:italic}
.kb-key.rec{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}

/* sync chip */
.sync{border:1px solid var(--line2);background:var(--btn);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--ok)}.sync.busy{color:var(--amber)}.sync.bad{color:var(--over)}
.linked{display:grid;gap:8px;background:var(--stat);border-radius:10px;padding:12px}

/* advanced settings */
.adv{display:grid;gap:18px}
.adv section{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.adv section:first-child{border-top:0;padding-top:0}
.crow{display:grid;grid-template-columns:1fr 110px 110px auto;gap:8px;align-items:center}
.crow-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.crow .nm{font-size:13px;font-weight:600}
.crow .nm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.cbtn{display:flex;align-items:center;gap:6px;padding:4px;border-radius:8px;border:2px solid transparent;background:#F3F4F7;color:#1A1F2B;font-size:11.5px;font-weight:600}
.cbtn.dk{background:#0B1324;color:#E9ECF2}
.cbtn[aria-pressed="true"]{border-color:var(--accent)}
.cbtn i{width:26px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.15);flex:none}
.cwarn{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--over)}
.crow .hsv{grid-column:1/-1}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px}
.tgl small{display:block;color:var(--muted);font-size:12px}
.tgl input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.tgl input.hr{width:220px;max-width:55%;flex:none}
.inl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.inl .inp{width:auto}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.1);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.timer .in{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:8px 18px;align-items:center}
.timer.idle .clock{color:var(--warn-tx)}
.clock{font-size:34px;font-weight:800;letter-spacing:-.02em;min-width:5ch;color:var(--act)}
.timer.brk .clock{color:var(--ok)}
.tinfo{display:grid;gap:3px;min-width:0}
.tinfo .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tinfo b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{height:6px;border-radius:3px;background:var(--line2);flex:var(--w) 1 0;min-width:8px;max-width:120px}
.pips i.done{background:var(--act)}
.pips i.cur{background:var(--accent)}
.tbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.timer .in{grid-template-columns:auto 1fr}.tbtns{grid-column:1/-1;justify-content:flex-start}.clock{font-size:28px}}
.toast .undo{margin-left:14px;border:0;background:transparent;color:var(--act);font-weight:800;padding:0;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion:no-preference){.btn,.segbar,.blk,.vblk{transition:background .15s,border-color .15s}}

/* round 6: branding, value, flags, attachments, viewer */
.brand img{height:30px;width:auto;max-width:120px;object-fit:contain;flex:none}
.brand svg.tint *:not([fill="none"]){fill:var(--accent)!important}
.brand svg.tint [stroke]:not([stroke="none"]){stroke:var(--accent)!important}
.pc.plain,.pct-p{color:var(--ink);font-weight:800}
.chip.flag{background:color-mix(in srgb,var(--amber) 16%,var(--surface));color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 45%,transparent)}
.chip.neutral{background:var(--stat);color:var(--ink)}
.chip.type{background:var(--stat);color:var(--muted);font-weight:700;letter-spacing:.02em}
.val{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.val .low,.val .low b{color:var(--amber)}
.mx{color:var(--faint);font-weight:600;font-size:.92em}
.fc{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.ph-name .chip{margin-left:4px}
.rnd{display:grid;gap:6px}
.rnd-i{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;background:var(--stat);border-radius:9px;padding:8px 10px}
.rnd-i b{font-size:13px}
.rnd-i .sub{white-space:pre-wrap}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.att{position:relative;min-width:0}
.att-open{display:grid;gap:3px;width:100%;border:1px solid var(--line2);background:var(--btn);border-radius:10px;padding:6px;text-align:left;color:var(--ink)}
.att-open:hover{border-color:var(--accent)}
.att .th{position:relative;display:grid;place-items:center;height:78px;border-radius:7px;background:var(--stat);overflow:hidden}
.att .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.att .bdg{position:relative;z-index:1;font-size:10px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--bc);padding:3px 7px;border-radius:5px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .th img+.bdg,.att .th.has .bdg{position:absolute;left:5px;bottom:5px;font-size:9px;padding:2px 5px}
.att .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .sz{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.att-wrap{display:grid;gap:8px}
.brand-prev{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);min-width:0}
.brand-prev svg{height:30px;width:auto;fill:var(--accent);flex:none}
.brand-prev b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inl input[type="color"]{width:44px;height:30px;border:1px solid var(--line2);border-radius:7px;padding:2px;background:var(--field)}
#viewer-root .vw{position:fixed;inset:0;z-index:60;background:rgba(8,10,16,.97);display:grid;grid-template-rows:auto 1fr;color:#E9ECF2}
.vw-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.vw-t{margin-right:auto;min-width:0;display:grid}
.vw-t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-t span{font-size:12px;color:#A5ADC0}
.vw .btn{background:#2E394E;border-color:#3A4763;color:#E9ECF2}

.pr .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}.pr .thumbs figure{margin:0}.pr .thumbs img{width:100%;height:120px;object-fit:cover;border:1px solid #ccc;border-radius:4px}.pr .thumbs figcaption{font-size:10.5px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function lum(h){return hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const effColor=(st,key,t)=>{const c=(st.colors||{})[key],K=CKEYS.find(x=>x.k===key);return (c&&c[t])||K.d[t==="light"?0:1]};

/* ===================== color slot moves ===================== */
/* Blocks and phases remember a color by slot (p1…p12, lf1…lf12). When colors move to new slots,
   every reference follows so nothing changes its look. pm[newIndex] = oldIndex (0-based). */
function remapSlots(kind,pm){
  if(pm.every((o,k)=>o===k))return;
  const pre=kind==="life"?"lf":"p",m={};pm.forEach((o,k)=>m[pre+(o+1)]=pre+(k+1));
  const f=c=>m[c]||c;
  if(kind==="life"){["wk","sun"].forEach(t=>(S.settings.routine[t]||[]).forEach(x=>x.color=f(x.color)));S.plans.forEach(p=>{if(p.color)p.color=f(p.color)})}
  else{S.projects.forEach(p=>p.phases.forEach(ph=>ph.color=f(ph.color)));Object.values(S.phaseTemplates||{}).forEach(t=>{if(t.data)t.data.color=f(t.data.color)});
    (S.templates||[]).forEach(t=>((t.data&&t.data.phases)||[]).forEach(ph=>ph.color=f(ph.color)))}
}
/* One-time update (Oct 2026): your new default phase colors, and life colors in spectrum order. Runs once per tracker, after a fresh sync. */
function migrateColors(){
  if(S.settings.colorV2)return;const st=S.settings,cp=o=>JSON.parse(JSON.stringify(o)),ro=a=>LIFE_ORDER.map(o=>a[o-1]);
  st.palette=cp(PAL_DEF);if(st.palDefault&&st.palDefault.phase)st.palDefault.phase=cp(PAL_DEF);
  const lp=st.lifePalette;if(lp&&lp.light&&lp.light.length===12)st.lifePalette={light:ro(lp.light),dark:ro(lp.dark)};else st.lifePalette=cp(LPAL_DEF);
  if(st.palDefault&&st.palDefault.life&&st.palDefault.life.light)st.palDefault.life={light:ro(st.palDefault.life.light),dark:ro(st.palDefault.life.dark)};
  remapSlots("life",LIFE_ORDER.map(o=>o-1));st.colorV2=true;applyPalette();commit();
}

const pctCls=over=>over?(OC()?"pct-o":"pct-p"):(WC()?"pct-w":"pct-p");
const budgetChip=(act,budget)=>{const r=act/Math.max(budget,1);return act>budget&&budget?`<span class="chip ${OC()?"over":"neutral"}">Over Budget</span>${S.settings.showPct?` <span class="${pctCls(1)}">${pctOf(act,budget)}%</span>`:""}`:r>=WA()?`<span class="${pctCls(0)}">${pctOf(act,budget)}% of Budget</span>`:""};
const numsLine=(b,e,a)=>`<b>${fmtH(b)}</b> Budget · <b>${fmtH(e)}</b> Estimated · <b class="a ${a>b&&OC()?"over":""}">${fmtH(a)}</b> Actual`;

/* ===================== value, rounds, forecast ===================== */
const HPD=()=>S.settings.hpd||6;
const ptype=p=>p.type||"Internal";
const isShadow=p=>ptype(p)!=="Client";
const counted=ph=>!ph.bonus||S.settings.includeBonus;
function priceOf(p){const pr=p.pricing||{},rate=numv(pr.rate)||numv(S.settings.rate)||150;return{mode:pr.mode||"hourly",rate,day:numv(pr.dayRate)||rate*HPD(),fee:numv(pr.fee)||0,billOver:!!pr.billOver}}
function progressOf(ph){
  if(ph.items.length){let te=0,de=0;ph.items.forEach(it=>{const e=Math.max(itemStats(it).est,1);te+=e;if(isDone(it))de+=e});return te?de/te:0}
  const s=phaseStats(ph);return Math.min(s.act/Math.max(s.budget,1),1)}
function phaseFee(p,ph,P){if(P.mode==="phaseFee")return numv(ph.fee)||0;const tot=p.phases.filter(counted).reduce((a,x)=>a+(x.budget||0),0);return counted(ph)&&tot?P.fee*(ph.budget||0)/tot:0}
function phaseVal(p,ph,P=priceOf(p)){
  const s=phaseStats(ph),ah=s.act/60,bh=(s.budget||s.est)/60;
  if(P.mode==="hourly"||P.mode==="day"){const H=P.mode==="day"?(numv(ph.dayRate)||P.day)/HPD():(numv(ph.rate)||P.rate);
    const bill=P.billOver||!bh?ah:Math.min(ah,bh),earned=bill*H;return{est:bh*H,earned,eff:ah?earned/ah:null,pace:null,rate:H,ah,fee:0}}
  const fee=phaseFee(p,ph,P),pr=progressOf(ph);
  return{est:fee,earned:fee*pr,eff:ah&&fee?fee/ah:null,pace:ah&&fee&&pr>0&&pr<1?fee*pr/ah:null,prog:pr,ah,fee}}
function projectVal(p){const P=priceOf(p);let est=0,earned=0,ah=0;
  p.phases.filter(counted).forEach(ph=>{const v=phaseVal(p,ph,P);est+=v.est;earned+=v.earned;ah+=v.ah});
  if(P.mode==="projectFee")est=P.fee;
  const fee=P.mode==="projectFee"||P.mode==="phaseFee"?est:0,pr=est?earned/est:0;
  return{P,est,earned,ah,eff:!ah?null:fee?fee/ah:earned/ah,pace:fee&&ah&&pr>0&&pr<1?fee*pr/ah:null}}
const lowRate=(p,v)=>!isShadow(p)&&S.settings.flagRate!==false&&S.settings.rateFloor>0&&v!=null&&v<S.settings.rateFloor;
const rateTxt=v=>v==null?"—":money(v)+"/h";
const MODES=[["hourly","Hourly"],["day","Day Rate"],["phaseFee","Fixed Fee per Phase"],["projectFee","Fixed Project Fee"]];
function valueLine(p,v,isPhase){
  if(!S.settings.showValue)return"";const sh=isShadow(p);
  if(isPhase&&!v.est&&!v.earned&&v.ah===0)return"";
  const low=x=>lowRate(p,x)?"low":"";
  const parts=[`${sh?"Shadow Value":"Estimated Value"} <b>${moneyX(v.est)}</b>`];
  if(isPhase&&!v.ah)return `<span class="nums val">${parts[0]}</span>`;
  parts.push(`${sh?"Worth So Far":"Earned So Far"} <b>${moneyX(v.earned)}</b>`);
  if(!sh){parts.push(`<span class="${low(v.eff)}">Effective Rate <b>${rateTxt(v.eff)}</b></span>`);if(v.pace!=null)parts.push(`<span class="${low(v.pace)}">On Pace for <b>${rateTxt(v.pace)}</b></span>`)}
  return `<span class="nums val">${parts.join(" · ")}${lowRate(p,v.eff)||lowRate(p,v.pace)?` <span class="chip flag">Below Your ${money(S.settings.rateFloor)}/h Floor</span>`:""}</span>`}
const roundsIncl=p=>{const v=p.roundsIncl;return v===0||v>0?v:(S.settings.roundsIncl??1)};
const roundsOf=ph=>ph.rounds||[];
const overScope=(p,ph)=>roundsIncl(p)>0&&roundsOf(ph).length>roundsIncl(p);
function roundsTxt(p,ph){const n=roundsOf(ph).length,inc=roundsIncl(p);if(!n)return"";
  if(overScope(p,ph)&&S.settings.flagScope!==false)return ` <span class="chip flag">Over Scope · Round ${n} of ${inc}</span>`;
  return inc>0?` · Round ${n} of ${inc}`:` · ${n} Feedback Round${n>1?"s":""}`}
const dmMissing=p=>ptype(p)==="Client"&&!(p.dm||"").trim()&&S.settings.flagDM!==false;
function forecast(p){
  let rem=0;p.phases.filter(counted).forEach(ph=>{if(ph.items.length&&ph.items.every(isDone))return;const s=phaseStats(ph);rem+=Math.max(0,Math.max(s.budget,s.est)-s.act)});
  const ids=new Set();p.phases.forEach(ph=>ph.items.forEach(it=>it.steps.forEach(st=>ids.add(st.id))));
  const from=iso(addDays(new Date(),-13)),td=TODAY(),pace=S.sessions.filter(x=>ids.has(x.step)&&x.date>=from&&x.date<=td).reduce((a,x)=>a+x.dur,0)/14;
  const days=rem&&pace?Math.ceil(rem/pace):null,fin=days!=null?iso(addDays(new Date(),days)):null;
  const late=!!(p.due&&rem&&(fin?fin>p.due:p.due<td)),left=p.due?daysBetween(td,p.due)+1:0;
  return{rem,pace,fin,late,lateBy:fin&&p.due?daysBetween(p.due,fin):0,need:p.due&&rem&&left>0?rem/left:null}}
function forecastLine(p){
  const f=forecast(p);if(!p.due&&!f.rem)return"";
  const parts=[];if(p.due)parts.push(`Due <b>${short(p.due)}</b>`);
  if(!f.rem)parts.push("All Phases Done");
  else{parts.push(`<b>${fmtH(f.rem)}</b> Left`);parts.push(f.fin?`Projected Finish <b>${short(f.fin)}</b> at ${fmtN(f.pace)}h/Day`:"Log Time to See a Projected Finish");
    if(f.late&&f.need)parts.push(`Needs ${fmtN(f.need)}h/Day to Finish on Time`)}
  const flag=f.late&&S.settings.flagLate!==false?` <span class="chip flag">Running Late${f.lateBy>0?` · ${f.lateBy} Day${f.lateBy>1?"s":""}`:""}</span>`:"";
  return `<span class="nums val">${parts.join(" · ")}${flag}</span>`}
function clientLine(p){const t=ptype(p);
  return `<div class="fc"><span class="chip type">${t==="Pitch"?"Pitch":t}</span>${p.client?`<span class="sub">Client <b>${esc(p.client)}</b></span>`:""}${p.dm?`<span class="sub">Decision-Maker <b>${esc(p.dm)}</b></span>`:""}${dmMissing(p)?`<span class="chip flag">No Decision-Maker Named</span>`:""}</div>`}
const hasNotes=o=>!!((o.notes&&o.notes.trim())||(o.files&&o.files.length));

function renderHeader(){
  renderBrand();

  document.body.classList.toggle("pg-board",S.ui.view==="board");
  const t=S.settings.target*60,done=S.sessions.filter(s=>s.date===TODAY()).reduce((a,s)=>a+s.dur,0)+(T&&T.kind==="work"?T.elapsed/60000:0);
  const r=Math.min(done/t,1),C=2*Math.PI*10;
  document.getElementById("today-ring").innerHTML=`<svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="var(--act-empty)" stroke-width="4"/><circle cx="13" cy="13" r="10" fill="none" stroke="var(--act)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C*r} ${C}" transform="rotate(-90 13 13)"/></svg><span class="num"><span class="a">${fmtN(done)}</span> / ${S.settings.target}h Today</span>`;
  const th=document.documentElement.getAttribute("data-theme");

  const live=S.projects.filter(x=>!x.archived);
  const projOpts=[["Client","Client Projects"],["Internal","Internal Projects"],["Pitch","Pitches"]].map(([t,l])=>{const L=live.filter(x=>ptype(x)===t);return L.length?`<optgroup label="${l}">${L.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${esc(x.name)}</option>`).join("")}</optgroup>`:""}).join("");
  return `

      <button class="btn" data-notes-proj="${p.id}">Notes${hasNotes(p)?`<i class="ndot"></i>`:""}</button><button class="btn" data-edit-proj="${p.id}">Edit</button><button class="btn" data-creport="${p.id}">Client Report</button><button class="btn" data-act="add-phase">+ Phase</button></div>
    ${clientLine(p)}
    ${bar(ta,te,tb,26)}
    <div class="row"><span class="nums grow">${numsLine(tb,te,ta)} ${budgetChip(ta,tb)}</span>
      ${S.settings.includeBonus?"":`<span class="nums">With Bonus: <b class="a">${fmtH(ca)}</b> of <b>${fmtH(cb)}</b> Ceiling</span>`}</div>
    ${valueLine(p,projectVal(p))}
    ${forecastLine(p)}
  </section>
  <div class="legend"><span><i style="--c:var(--act)"></i>Hours Used</span><span><i style="--c:var(--left)"></i>Hours Left in Budget</span>${WC()?`<span><i style="--c:var(--warn)"></i>${S.settings.warnAt||80}% Budget Used</span>`:""}${OC()?`<span><i style="--c:var(--over)"></i>Over Budget</span>`:""}<span><i class="mark"></i>Estimated Total</span></div>
  <div class="phases">${p.phases.length?p.phases.map(phaseCard).join(""):`<section class="panel"><p class="empty">This project has no phases yet. Tap + Phase to add the first one, with its hour budget.</p></section>`}</div>`;
}
function phaseCard(ph){
  const s=phaseStats(ph),open=!!S.ui.open[ph.id],n=ph.items.length,p=IX.idx.phase[ph.id].p;
  return `<section class="phase ${open?"open":""} ${ph.bonus?"bonus":""}">
    <button class="ph-head" data-toggle-phase="${ph.id}" aria-expanded="${open}">
      <span class="ph-name"><b><span class="caret">▶</span><span class="dot" style="--c:var(--${ph.color})"></span>${esc(ph.name)}</b>
        <span class="sub">${n?`${n} Item${n>1?"s":""}`:"No Items Yet"}${ph.due?` · <span class="${ph.due<TODAY()&&(!n||ph.items.some(it=>!isDone(it)))?"late":""}">Target ${short(ph.due)}${ph.due<TODAY()&&(!n||ph.items.some(it=>!isDone(it)))?" · Past Due":""}</span>`:""}${ph.bonus?" · Bonus, Outside the Main Budget":""}${roundsTxt(p,ph)}</span></span>
      <span class="ph-bar">${bar(s.act,s.est,s.budget,22,S.settings.phaseBarColors?ph.color:null)}<span class="nums">${numsLine(s.budget,s.est,s.act)} ${budgetChip(s.act,s.budget)}</span>${valueLine(p,phaseVal(p,ph),true)}</span>
    </button>
    ${open?`<div class="ph-body">${phaseBody(ph)}</div>`:""}
  </section>`;
}
function phaseBody(ph){
  const done=ph.items.filter(isDone).length,vis=ph.hideDone?ph.items.filter(it=>!isDone(it)):ph.items;
  const groups=[];vis.forEach(it=>{let g=groups.find(x=>x.name===(it.group||""));if(!g){g={name:it.group||"",items:[]};groups.push(g)}g.items.push(it)});
  const rows=groups.map(g=>{
    let ge=0,ga=0;g.items.forEach(it=>{const s=itemStats(it);ge+=s.est;ga+=s.act});
    return `<div class="grp"><div class="grp-l"><button class="grp-name" data-rgrp="${ph.id}" data-g="${esc(g.name)}" title="Rename This Row">${esc(g.name||"Items")}</button><span>${AE(ga,ge,fmtHM,true)}${pctTag(ga,ge)}</span></div>
      <div class="segs">${g.items.map(it=>{const s=itemStats(it),e=Math.max(s.est,1),r=s.act/e,w=WC()?WA():2,ov=s.act>e,f=ov?100:Math.min(r,w)*100,y=!ov&&r>w?(r-w)*100:0,o=ov&&OC()?Math.min((s.act-e)/e,.5)*100:0;
        return `<button class="segbox ${S.settings.itemPhaseColors?"tint":""}" style="flex-grow:${e};--bc:var(--${ph.color})" data-open-item="${it.id}" title="${esc(it.name)} · ${esc(it.status)}">
          <span class="segbar"><span class="f ${ov&&OC()?"over":""}" style="width:${f}%"></span>${y?`<span class="y" style="left:${f}%;width:${y}%"></span>`:""}${o?`<span class="o" style="width:${o}%"></span>`:""}<span class="lab">${esc(it.name)}</span></span>
          <span class="m"><span class="st-dot" style="--sc:var(${SC[it.status]})"></span>${AE(s.act,s.est,fmtHM,true)}${pctTag(s.act,s.est)}</span></button>`}).join("")}</div></div>`;
  }).join("");
  return `${rows||(ph.items.length?`<p class="empty">All items in this phase are done. Tap Show Done to see them.</p>`:`<p class="empty">Add the pages or proposals for this phase. Each item gets steps with estimates, and the timer logs time to them.</p>`)}
    <div class="row"><button class="btn sm" data-act="add-item" data-ph="${ph.id}">+ Item</button><button class="btn sm ghost" data-act="edit-phase" data-ph="${ph.id}">Edit Phase</button><button class="btn sm ghost" data-notes-ph="${ph.id}">Notes${hasNotes(ph)?`<i class="ndot"></i>`:""}</button><button class="btn sm ghost" data-rounds="${ph.id}">Feedback Rounds${roundsOf(ph).length?` (${roundsOf(ph).length})`:""}</button>
    ${done?`<button class="btn sm ghost" data-hidedone="${ph.id}">${ph.hideDone?`Show Done (${done})`:`Hide Done (${done})`}</button>`:""}
    <span class="sub grow" style="text-align:right">Tap an Item to See Its Steps and Start the Timer</span></div>`;
}

function bindSched(box,list){
  const draw=()=>{box.innerHTML=schedEditor(list);bind()};
  const bind=()=>{
    box.querySelectorAll(".se").forEach(row=>{const e=list[+row.dataset.i];
      row.querySelectorAll("[data-k]").forEach(inp=>{const k=inp.dataset.k;const ev=inp.type==="checkbox"||inp.tagName==="SELECT"?"onchange":"oninput";
        inp[ev]=()=>{let v=inp.type==="checkbox"?inp.checked:inp.value;if(k==="day")v=+v;if(k==="start")v=toMin(v||"09:00");if(k==="dur")v=Math.max(5,+v||5);e[k]=v;if(k==="repeat"||k==="allDay")draw()}})});
    box.querySelectorAll("[data-sx]").forEach(b=>b.onclick=()=>{list.splice(+b.dataset.sx,1);draw()});
    box.querySelector("[data-sadd]").onclick=()=>{list.push({id:uid(),label:"",repeat:"weekly",day:0,allDay:true,start:540,dur:60,from:"",to:"",date:"",skip:[]});draw()};
  };draw();
}

const BADGE_C={psd:"#2F7FD9",psb:"#2F7FD9",procreate:"#4A4A55",ai:"#E07B00",eps:"#E07B00",pdf:"#D33A3A",jpg:"#2E9E6A",jpeg:"#2E9E6A",png:"#2E9E6A",gif:"#2E9E6A",webp:"#2E9E6A",heic:"#2E9E6A",tif:"#2E9E6A",tiff:"#2E9E6A",svg:"#C79A00",zip:"#6F7482",rar:"#6F7482",mp4:"#8A4FD8",mov:"#8A4FD8",blend:"#E87D0D",clip:"#C0457A",kra:"#3A6FD8",fig:"#A259FF",doc:"#2B5FB4",docx:"#2B5FB4",xls:"#1F7A45",xlsx:"#1F7A45",ppt:"#C4502A",pptx:"#C4502A",key:"#2B6BD8",txt:"#6F7482",drive:"#1A73E8",dropbox:"#0061FE"};
function badgeOf(a){let e=a.kind==="link"?(extOf(a.name)||extOf(a.url)):extOf(a.name);
  if(!e&&a.kind==="link"){const u=String(a.url||"");e=/drive\.google|docs\.google/.test(u)?"drive":/dropbox\./.test(u)?"dropbox":"link"}
  return{t:(e||"file").toUpperCase(),c:BADGE_C[e]||"#5A6378"}}
const fsize=b=>!b?"":b<1048576?Math.max(1,Math.round(b/1024))+" KB":(b/1048576).toFixed(b<10485760?1:0)+" MB";
const attOwners=()=>{const o=[];S.projects.forEach(p=>{o.push(p);p.phases.forEach(ph=>{o.push(ph);ph.items.forEach(it=>o.push(it))})});return o};
function findAtt(id){for(const o of attOwners())for(const a of o.files||[])if(a.id===id)return{o,a};return null}
const allDriveIds=()=>{const s=new Set();attOwners().forEach(o=>(o.files||[]).forEach(a=>{if(a.driveId)s.add(a.driveId)}));return s};
const driveIdsIn=o=>{const out=[],walk=x=>{(x.files||[]).forEach(a=>{if(a.driveId)out.push(a.driveId)});(x.phases||[]).forEach(walk);(x.items||[]).forEach(walk)};walk(o);return out};
const ownerOf=ref=>ref.kind==="project"?S.projects.find(p=>p.id===ref.id):ref.kind==="phase"?(IX.idx.phase[ref.id]||{}).ph:(IX.idx.item[ref.id]||{}).it;
const projOfRef=ref=>ref.kind==="project"?ownerOf(ref):ref.kind==="phase"?(IX.idx.phase[ref.id]||{}).p:(IX.idx.item[ref.id]||{}).p;
const FIDX=()=>LS.get(K_FIDX,{});
async function cacheGet(id){if(memFiles[id])return memFiles[id];if(!FIDX()[id])return null;const b=await IDB.get("file:"+id);return b instanceof Blob?b:null}
async function cachePut(id,blob){if(keepOffline()){await IDB.set("file:"+id,blob);const x=FIDX();x[id]=blob.size;LS.set(K_FIDX,x)}else memFiles[id]=blob}
async function cacheDel(id){delete memFiles[id];const x=FIDX();if(x[id]!==undefined){delete x[id];LS.set(K_FIDX,x)}await IDB.del("file:"+id)}
async function clearOffline(){await Promise.all(Object.keys(FIDX()).map(k=>IDB.del("file:"+k)));LS.set(K_FIDX,{});Object.keys(fileURLs).forEach(k=>{URL.revokeObjectURL(fileURLs[k]);delete fileURLs[k]});refreshAttViews()}

const b64ToBytes=t=>{const bin=atob(t),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
const blobB64=b=>readURL(b).then(u=>String(u).slice(String(u).indexOf(",")+1));
function driveErr(x){const m=String(x&&x.message||x);
  return /Unknown action/i.test(m)?"Update your Google Sheet script first: paste the new Code.gs, run setupDrive, then deploy a new version."
    :m==="NO_DRIVE"||/permission|authoriz/i.test(m)?"Google Drive access isn't allowed yet. In Apps Script, run setupDrive once and approve it."
    :m==="NOT_CONNECTED"?"Connect this device to your Google Sheet first."
    :m==="NO_FILE"?"That file is no longer in your Google Drive."
    :"Couldn't reach Google Drive. Check your connection (VPN in China) and try again."}
async function driveFetch(a){const parts=[];let n=1,mime=a.mime;
  for(let i=0;i<n;i++){const r=await Sync.call("download",{id:a.driveId,part:i});n=r.parts||1;mime=r.mime||mime;parts.push(b64ToBytes(r.data||""))}
  return new Blob(parts,{type:mime||"application/octet-stream"})}
async function getBlob(a){
  if(a.kind==="link")return null;
  if(a.pending){const u=memUp[a.id]||await IDB.get("up:"+a.id);if(u&&u.blob)return u.blob;throw new Error("ELSEWHERE")}
  let b=await cacheGet(a.driveId);if(b)return b;
  if(!Sync.connected())throw new Error("NOT_CONNECTED");
  b=await(inflight[a.driveId]=inflight[a.driveId]||driveFetch(a).finally(()=>delete inflight[a.driveId]));
  await cachePut(a.driveId,b);return b}
async function localURL(a){if(fileURLs[a.id])return fileURLs[a.id];let b=null;
  if(a.pending){const u=memUp[a.id]||await IDB.get("up:"+a.id);b=u&&u.blob}else if(a.driveId)b=await cacheGet(a.driveId);
  return b?(fileURLs[a.id]=URL.createObjectURL(b)):null}
function refreshAttViews(){document.querySelectorAll("[data-attgrid]").forEach(e=>{if(e._draw)e._draw()})}
/* add files: they wait on this device until they reach Drive, so attaching works offline too */
async function addFiles(ref,list){
  const files=[...list],big=files.filter(f=>f.size>MAX_UP),ok=files.filter(f=>f.size<=MAX_UP&&f.size>0);
  if(big.length)toast(`${big.map(f=>f.name).join(", ")} ${big.length>1?"are":"is"} over 15 MB. Use Add Link for big files.`,5500);
  if(!ok.length)return;const p=projOfRef(ref),folder=p?p.name:"";
  const added=[];for(const f of ok){const a={id:uid(),kind:"drive",name:f.name,mime:f.type||mimeOf(f.name),size:f.size,added:TODAY(),pending:true};
    const rec={blob:f.slice(0,f.size,f.type||mimeOf(f.name)),folder};memUp[a.id]=rec;await IDB.set("up:"+a.id,rec);added.push(a)}
  const o=ownerOf(ref);if(!o)return;o.files=[...(o.files||[]),...added];
  LS.set(K_UPQ,[...LS.get(K_UPQ,[]),...added.map(a=>a.id)]);commit();runUploads();
}
let upRun=false,upWarned=0;
async function runUploads(){
  if(upRun||!Sync.connected())return;upRun=true;let did=0;
  try{let q=LS.get(K_UPQ,[]);
    while(q.length){const id=q[0],f=findAtt(id),u=memUp[id]||await IDB.get("up:"+id);
      if(!f||!f.a.pending||!u){q=LS.get(K_UPQ,[]).filter(x=>x!==id);LS.set(K_UPQ,q);if(!f)await IDB.del("up:"+id);continue}
      let r;try{r=await Sync.call("upload",{name:f.a.name,mime:f.a.mime||"application/octet-stream",folder:u.folder||"",data:await blobB64(u.blob)})}
      catch(x){if(Date.now()-upWarned>60000){upWarned=Date.now();toast(/Unknown action|NO_DRIVE|permission/i.test(x.message)?driveErr(x):"Files are saved on this device and upload when you're back online.",6000)}break}
      const g=findAtt(id);
      if(g){Object.assign(g.a,{driveId:r.id,url:r.url,size:r.size||g.a.size});delete g.a.pending;await cachePut(r.id,u.blob);did++;commit()}
      else queueTrash([r.id],0);
      delete memUp[id];await IDB.del("up:"+id);q=LS.get(K_UPQ,[]).filter(x=>x!==id);LS.set(K_UPQ,q)}}
  finally{upRun=false}
  if(did){refreshAttViews();toast(did>1?`${did} files saved to Google Drive`:"Saved to Google Drive")}
}
/* removed files go to the Drive trash a few seconds later, after the Undo window */
function queueTrash(ids,delay=9000){ids=ids.filter(Boolean);if(!ids.length)return;const at=Date.now()+delay,q=LS.get(K_TRASH,[]);ids.forEach(id=>{if(!q.some(x=>x.id===id))q.push({id,at})});LS.set(K_TRASH,q);setTimeout(runTrash,delay+300)}
let trRun=false;
async function runTrash(){
  if(trRun)return;const q=LS.get(K_TRASH,[]);if(!q.length)return;const live=allDriveIds(),now=Date.now();
  const back=q.filter(x=>live.has(x.id)),due=q.filter(x=>!live.has(x.id)&&x.at<=now);
  if(back.length)LS.set(K_TRASH,q.filter(x=>!live.has(x.id)));
  if(!due.length||!Sync.connected())return;trRun=true;
  try{await Sync.call("trash",{ids:due.map(x=>x.id)});const ids=new Set(due.map(x=>x.id));LS.set(K_TRASH,LS.get(K_TRASH,[]).filter(x=>!ids.has(x.id)));for(const id of ids)await cacheDel(id)}
  catch(x){}finally{trRun=false}
}
/* Keep All Attachments Offline: download anything this device doesn't have yet, one file at a time */
let offRun=false;
async function syncOffline(){
  if(offRun||!keepOffline()||!Sync.connected()||!navigator.onLine)return;offRun=true;
  try{if(navigator.storage&&navigator.storage.persist&&!syncOffline.asked){syncOffline.asked=1;navigator.storage.persist().catch(()=>{})}}catch(x){}
  try{const live=allDriveIds(),idx=FIDX();
    for(const id of Object.keys(idx))if(!live.has(id)&&!LS.get(K_TRASH,[]).some(x=>x.id===id))await cacheDel(id);
    for(const o of attOwners())for(const a of (o.files||[]).slice()){
      if(a.kind!=="drive"||!a.driveId||FIDX()[a.driveId])continue;
      try{const b=await driveFetch(a);await cachePut(a.driveId,b);refreshAttViews()}catch(x){if(x.message==="NO_FILE")continue;return}}}
  finally{offRun=false}
}

/* ===================== timer ===================== */
let T=null,audio=null,tickT=null;
const breakFor=m=>{const b=S.settings.breaks;return m>=90?b.long:m>=45?b.mid:b.short};
let lastInput=Date.now();["pointerdown","keydown","wheel","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{lastInput=Date.now()},{passive:true,capture:true}));
const SOUND_KINDS=[["stage","Stage End",880],["break","Break End",660],["idle","Still Working?",520]];
const sndBuf={};
function playSound(kind,force,vv){
  if(!S.settings.sound&&!force)return;const vol=Math.max(.0002,.35*(vv??S.settings.volume??70)/100);
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();
    const custom=S.sounds&&S.sounds[kind];
    if(custom&&custom.data){const key=kind+custom.data.length;
      const go=buf=>{const src=audio.createBufferSource(),g=audio.createGain();g.gain.value=Math.min(1,vol*2.6);src.buffer=buf;src.connect(g);g.connect(audio.destination);src.start()};
      if(sndBuf[key])return go(sndBuf[key]);
      const bin=atob(custom.data.split(",")[1]),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
      audio.decodeAudioData(arr.buffer,buf=>{sndBuf[key]=buf;go(buf)},()=>beep());return}
    beep();
    function beep(){const f=(SOUND_KINDS.find(x=>x[0]===kind)||[0,0,660])[2],o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(vol,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.9);o.start();o.stop(audio.currentTime+1)}
  }catch(e){}
}
const chime=(hi,force,vv)=>playSound(hi?"stage":"break",force,vv);
async function notifyUser(title,body){
  if(!S.settings.notify||!("Notification" in window)||Notification.permission!=="granted"||document.visibilityState==="visible")return;
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg&&reg.showNotification)return reg.showNotification(title,{body,icon:"icons/icon-192.png",badge:"icons/icon-192.png",tag:"bbst-timer",renotify:true});
    new Notification(title,{body,icon:"icons/icon-192.png",tag:"bbst-timer"})}catch(e){}
}
function startSheet(stepId){
  const {st,it}=IX.idx.step[stepId];
  modal(`<h2>Start: ${esc(it.name)} · ${esc(st.name)}</h2>
    ${st.stages.length?`<div class="field"><span class="lbl">YOUR STAGES</span>${st.stages.map((x,i)=>`<div class="row"><span class="grow">${i+1}. ${esc(x.n)} <span class="sub">${x.m}m · Then ${breakFor(x.m)}m Break</span></span><button class="btn sm ${i?"":"primary"}" data-from="${i}">Start Here</button></div>`).join("")}</div>`:""}
    <div class="field"><span class="lbl">${st.stages.length?"OR RUN STANDARD SPRINTS":"STANDARD SPRINTS"}</span><div class="row">
      ${S.settings.sprints.map((sp,i)=>`<button class="btn sm ${!st.stages.length&&!i?"primary":""}" data-sprint="${i}">${sp.w} Min + ${sp.b} Break</button>`).join("")}</div></div>

  root=>{const demo=()=>1;
    root.querySelectorAll("[data-from]").forEach(b=>b.onclick=()=>{const sp=demo();closeModal();startTimer(stepId,st.stages.map(x=>({...x})),Number(b.dataset.from),sp)});
    root.querySelectorAll("[data-sprint]").forEach(b=>b.onclick=()=>{const sp=demo();closeModal();{const x=S.settings.sprints[+b.dataset.sprint];startTimer(stepId,[{n:`Sprint · ${x.w} Min`,m:x.w,b:x.b}],0,sp,true)}});});
}
function startTimer(stepId,stages,idx,speed,sprint){
  if(T&&T.kind==="work"&&T.elapsed>60000)logWork();
  const rr=IX.idx.step[stepId];if(rr&&rr.it.status==="Not Started"){rr.it.status="In Progress";commit()}
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  T={stepId,stages,idx,speed,sprint:!!sprint,kind:"work",dur:stages[idx].m*60000,elapsed:0,running:true,last:Date.now(),since:T?.since||0};
  clearInterval(tickT);tickT=setInterval(tick,250);document.body.classList.add("timing");drawTimer();
}
function logWork(endTs=Date.now()){
  const min=Math.round(T.elapsed/60000);if(min<1)return;
  const st=new Date(endTs-min*60000);S.sessions.push({id:uid(),step:T.stepId,date:iso(st),start:st.getHours()*60+st.getMinutes(),dur:min,timer:true});T.since+=min;commit();
}
let lastP=0;function persistT(force){if(!force&&Date.now()-lastP<2000)return;lastP=Date.now();if(T)LS.set(K_T,T);else LS.del(K_T)}
function tick(){
  if(!T||!T.running)return;
  const n=Date.now();T.elapsed+=(n-T.last)*T.speed;T.last=n;
  if(T.kind==="work"&&!T.idle&&S.settings.idlePrompt&&n-lastInput>=S.settings.idleMin*60000){T.idle=true;T.idleFrom=lastInput;playSound("idle");notifyUser("Still Working?","The timer is still running. Open the tracker to keep going or remove idle time.")}
  if(T.elapsed>=T.dur){
    if(T.kind==="work"){
      const endTs=n-(T.elapsed-T.dur);T.elapsed=T.dur;T.idle=false;logWork(endTs);playSound("stage");
      const B=S.settings.breaks;let br=T.stages[T.idx].b??breakFor(T.stages[T.idx].m),long=false;
      if(T.since>=B.afterMin){br=B.longMin;long=true;T.since=0}
      T.kind="break";T.long=long;T.dur=br*60000;T.elapsed=0;
      notifyUser(T.long?"Long Break":"Stage Done",`${T.stages[T.idx].n} is done. Take a ${Math.round(T.dur/60000)}-minute break.`);
    }else{playSound("break");notifyUser("Break Over","Ready when you are. Open the tracker to start the next stage.");T.kind="wait";T.running=false}
  }
  drawTimer();renderHeader();
}
/* ===================== calendar alerts (per device) ===================== */
const K_CAL="bbst-calalerts",K_DEV="bbst-device";
const calOn=()=>LS.get(K_CAL,false)===true;
const devId=(()=>{let d=LS.get(K_DEV,null);if(!d){d=uid()+uid();LS.set(K_DEV,d)}return d})();
let lastCalSig=null,calT=null,calPending=null;
function calPlan(){
  if(!T||!T.running)return{set:[],clear:[devId+":stage",devId+":break"]};
  const now=Date.now(),left=Math.max(0,T.dur-T.elapsed),r=IX.idx.step[T.stepId],stage=T.stages[T.idx]||{};
  const ceilMin=t=>Math.ceil(t/60000)*60000;
  if(T.kind==="work"){const B=S.settings.breaks,mins=Math.round(T.dur/60000);let br=stage.b??breakFor(stage.m||25),long=false;if((T.since||0)+mins>=B.afterMin){br=B.longMin;long=true}
    const end=ceilMin(now+left),what=r?`${r.it.name} · ${r.st.name}`:"";
    return{set:[{key:devId+":stage",at:end,title:`Stage Done · ${stage.n||"Timer"}`,body:`${what}. Take a ${br}-minute ${long?"long ":""}break.`},{key:devId+":break",at:end+br*60000,title:"Break Over",body:"Open the tracker to start the next stage."}],clear:[]}}
  if(T.kind==="break")return{set:[{key:devId+":break",at:ceilMin(now+left),title:"Break Over",body:"Open the tracker to start the next stage."}],clear:[devId+":stage"]};
  return{set:[],clear:[devId+":stage",devId+":break"]};
}
function calSync(force){
  if(!calOn()&&!force)return;
  const plan=calOn()?calPlan():{set:[],clear:[devId+":stage",devId+":break"]};
  const sig=JSON.stringify(plan.set.map(a=>[a.key,a.at]))+"|"+plan.clear.join();
  if(sig===lastCalSig&&!force)return;lastCalSig=sig;calPending=plan;
  clearTimeout(calT);calT=setTimeout(sendCal,1200);
}
async function sendCal(){
  const plan=calPending;if(!plan||!Sync.connected())return;
  try{await Sync.call("alerts",plan);if(calPending===plan)calPending=null}
  catch(x){clearTimeout(calT);calT=setTimeout(sendCal,30000)}
}
addEventListener("online",()=>{if(calPending)sendCal()});

function drawTimer(){

  const r=IX.idx.step[T.stepId],stage=T.stages[T.idx],left=Math.max(0,T.dur-T.elapsed),mm=Math.floor(left/60000),ss=Math.floor(left%60000/1000);

    btns=`<button class="btn" id="tm-skip">Skip Break</button><button class="btn ghost" id="tm-stop">Stop</button>`}

    <div class="tbtns">${btns}</div></div></div>`;

function hoursHeader(){const[a,b]=range();let h="";for(let m=a;m<=b;m+=60){const H=m/60;h+=`<span style="left:${pct(m)}%;${m===a?"transform:none;":m===b?"transform:translateX(-100%);":""}">${hourLbl(H,m===a||H===12)}</span>`}return `<div class="srow" style="border-top:0"><div class="slab" style="padding-block:0"></div><div class="hours-h">${h}</div></div>`}
function lane(date){
  const[a,b]=range();
  let g="";for(let m=a;m<b;m+=30)g+=`<i class="gl ${m%60?"half":""}" style="left:${pct(m)}%"></i>`;
  const blocks=dayPlans(date).map(p=>{const s=Math.max(p.start,a),e=Math.min(p.start+p.dur,b);if(e<=s)return"";
    return `<div class="blk ${p.life?"life":""} ${p.sched?"sched":""}" data-plan="${p.id}" style="left:${pct(s)}%;width:${pct(e)-pct(s)}%;--c:var(--${blockColor(p)})" title="${esc(blockLabel(p))} · ${clock(p.start)}–${clock(p.start+p.dur)}"><span>${esc(blockLabel(p))}</span><span class="du">${fmtHM(p.dur)}</span><i class="rz"></i></div>`}).join("");
  const acts=S.sessions.filter(s=>s.date===date).map(s=>{const st=Math.max(s.start,a),e=Math.min(s.start+s.dur,b);if(e<=st)return"";

  const now=date===TODAY()&&nowMin()>=a&&nowMin()<=b?`<i class="now" style="left:${pct(nowMin())}%"></i>`:"";

}

function blockModal(planId,date,startMin){

/* tap, and hold-to-drag (week + day). Mouse drags right away; touch drags after a short hold. */
let drag=null,pinch=null;
const HOLD=380;
document.addEventListener("pointerdown",e=>{
  if(!e.isPrimary){if(drag)clearTimeout(drag.holdT);drag=null;return}
  const ln=e.target.closest(".lane,.vlane");if(!ln)return;
  const blk=e.target.closest(".vblk,.blk"),v=ln.dataset.orient==="v";
  drag={x:e.clientX,y:e.clientY,rect:ln.getBoundingClientRect(),date:ln.dataset.date,v,moved:false,armed:false,el:blk,pid:e.pointerId,mode:e.target.classList.contains("rz")?"size":"move",plan:blk?getPlan(blk.dataset.plan):null};
  if(!blk||(drag.plan&&drag.plan.sched))return;
  const arm=()=>{if(!drag||drag.cancel)return;drag.armed=true;drag.el.classList.add("drag");try{drag.el.setPointerCapture(drag.pid)}catch(x){}try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}};
  if(e.pointerType==="mouse"){arm();e.preventDefault()}else drag.holdT=setTimeout(arm,HOLD);
});
document.addEventListener("pointermove",e=>{
  if(!drag||pinch)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.armed){if(Math.hypot(dx,dy)>8){clearTimeout(drag.holdT);drag.cancel=true}return}
  if(!drag.plan)return;
  const d=drag.v?dy:dx;if(!drag.moved&&Math.abs(d)<4&&(drag.v||Math.abs(dy)<12))return;
  drag.moved=true;
  const[a,b]=range(),size=drag.v?drag.rect.height:drag.rect.width,dm=Math.round(d/size*(b-a)/15)*15,p=drag.plan;
  if(drag.mode==="move"){const s=Math.min(Math.max(a,p.start+dm),b-p.dur);drag.ns=s;
    if(drag.v){drag.el.style.top=pct(s)+"%"}else{drag.el.style.left=pct(s)+"%";
      const over=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains("lane"));
      document.querySelectorAll(".lane.drop").forEach(x=>x!==over&&x.classList.remove("drop"));
      if(over&&over.dataset.date!==drag.date){over.classList.add("drop");drag.nDate=over.dataset.date}else drag.nDate=null}
    const du=drag.el.querySelector(".du");if(du)du.textContent=drag.v?`${clock(s)} · ${fmtHM(p.dur)}`:`${clock(s)}`}
  else{const nd=Math.max(15,Math.min(p.dur+dm,b-p.start));drag.nd=nd;
    if(drag.v)drag.el.style.height=`calc(${pct(p.start+nd)-pct(p.start)}% - 2px)`;else drag.el.style.width=(pct(p.start+nd)-pct(p.start))+"%";
    const du=drag.el.querySelector(".du");if(du)du.textContent=fmtHM(nd)}
});
document.addEventListener("touchmove",e=>{if(drag&&drag.armed)e.preventDefault()},{passive:false});
document.addEventListener("contextmenu",e=>{if(e.target.closest(".blk,.vblk"))e.preventDefault()});
document.addEventListener("pointerup",e=>{
  if(!drag)return;const d=drag;drag=null;clearTimeout(d.holdT);document.querySelectorAll(".lane.drop").forEach(x=>x.classList.remove("drop"));
  if(d.el)d.el.classList.remove("drag");
  if(pinch)return;
  if(d.plan&&d.moved){undoable(()=>{const p=materialize(d.plan);if(d.ns!=null)p.start=d.ns;if(d.nd!=null)p.dur=d.nd;if(d.nDate)p.date=d.nDate;d.res=p},()=>`Moved to ${d.nDate?short(d.nDate)+" · ":""}${clock(d.res.start)}–${clock(d.res.start+d.res.dur)}`);return}
  if(d.cancel||Math.abs(e.clientX-d.x)>8||Math.abs(e.clientY-d.y)>8)return;
  if(d.plan)return d.plan.sched?schedEntryModal(d.plan.eid,d.plan.date):blockModal(d.plan.id);
  const[a,b]=range(),f=d.v?(e.clientY-d.rect.top)/d.rect.height:(e.clientX-d.rect.left)/d.rect.width,m=Math.floor((a+f*(b-a))/15)*15;
  blockModal(null,d.date,Math.min(Math.max(a,m),b-60));
});
document.addEventListener("pointercancel",()=>{if(drag&&drag.armed)return;if(drag)clearTimeout(drag.holdT);drag=null});

/* pinch to zoom the day column */
function setDayZoom(z,focusY){
  const sc=document.getElementById("day-scroll"),inn=document.getElementById("day-inner");if(!sc||!inn)return;
  z=Math.min(4,Math.max(1,z));
  const r=sc.getBoundingClientRect(),fy=focusY??r.top+r.height/2,frac=(sc.scrollTop+fy-r.top)/inn.offsetHeight;
  S.ui.dzoom=z;inn.style.height=z*100+"%";
  sc.scrollTop=frac*inn.offsetHeight-(fy-r.top);
}
function bindDayPinch(){
  const sc=document.getElementById("day-scroll");if(!sc)return;
  const dist=t=>Math.abs(t[0].clientY-t[1].clientY),mid=t=>(t[0].clientY+t[1].clientY)/2;
  sc.addEventListener("touchstart",e=>{if(e.touches.length===2){if(drag)clearTimeout(drag.holdT);drag=null;pinch={d0:Math.max(dist(e.touches),20),z0:S.ui.dzoom||1}}},{passive:true});
  sc.addEventListener("touchmove",e=>{if(pinch&&e.touches.length===2){e.preventDefault();setDayZoom(pinch.z0*dist(e.touches)/pinch.d0,mid(e.touches))}},{passive:false});

      ${o.value?(()=>{let v=0,w=0;phs.forEach(ph=>{const x=phaseVal(p,ph,P);v+=x.est;w+=x.earned});return `<span>Project Value <b>${money(v)}</b></span><span>Value Completed <b>${money(w)}</b></span>${P.mode==="hourly"||P.mode==="day"?`<span>Rate <b>${P.mode==="day"?money(P.day)+"/Day":money(P.rate)+"/h"}</b></span>`:""}`})():""}</div>
    ${o.notes&&p.notes&&p.notes.trim()?`<h2>Project Notes</h2><div class="note">${e(p.notes)}</div>`:""}
    ${await thumbs(p.files||[])}`;
  for(const ph of phs){const s=phaseStats(ph),n=roundsOf(ph).length,pv=phaseVal(p,ph,P),pr=Math.round(progressOf(ph)*100);
    const all=[...(ph.files||[]),...ph.items.flatMap(it=>it.files||[])];
    h+=`<div class="ph"><h2>${e(ph.name)}</h2><div class="meta"><span>Status: <b>${phaseStatus(ph)}</b></span><span>Progress <b>${pr}%</b></span>${ph.due?`<span>Target ${short(ph.due)}</span>`:""}
      ${o.rounds?`<span>Feedback Rounds: <b>${n}</b>${inc>0?` (${inc} Included${n>inc?`, ${n-inc} Extra`:""})`:""}</span>`:""}
      ${o.hours?`<span>Hours ${fmtH(s.act)} of ${fmtH(s.budget)}</span>`:""}${o.value&&(pv.est||pv.earned)?`<span>Value ${money(pv.est)}</span>`:""}</div>
      ${ph.items.length?`<table><tr><th>Item</th><th>Row</th><th>Status</th>${o.hours?"<th>Hours</th>":""}</tr>${ph.items.map(it=>{const x=itemStats(it);return `<tr><td>${e(it.name)}</td><td>${e(it.group||"")}</td><td>${e(it.status)}</td>${o.hours?`<td>${fmtH(x.act)} of ${fmtH(x.est)}</td>`:""}</tr>`}).join("")}</table>`:`<p class="sub">No items in this phase yet.</p>`}
      ${o.rounds&&n?`<p class="sub">${roundsOf(ph).map((r,i)=>`Round ${i+1}: ${short(r.d)}${r.note?` · ${e(r.note)}`:""}`).join("<br>")}</p>`:""}
      ${o.notes&&ph.notes&&ph.notes.trim()?`<div class="note">${e(ph.notes)}</div>`:""}
      ${await thumbs(all)}</div>`}
  return h;
}

function exportReviewsXLSX(X,range){
  const now=new Date(),ty=now.getFullYear(),tm=now.getMonth();
  let from=range==="month"?new Date(ty,tm,1):range==="3m"?new Date(ty,tm-2,1):range==="year"?new Date(ty,0,1):null;
  if(!from){const ds=[...S.sessions.map(s=>s.date),...Object.keys(S.weekly),...Object.keys(S.monthly).map(k=>k+"-01")].sort();from=ds.length?parse(ds[0]):new Date(ty,tm,1)}
  const fromS=iso(from),toS=TODAY(),H=m=>Math.round(m/60*100)/100;
  const wk=[["Week Start","Week End","Logged (h)","Target (h)","Items Submitted","Items Planned","Budget Alerts","What Worked","What to Improve","Feedback Summary","Next Week's Focus"]];
  for(let d=weekOf(from);iso(d)<=toS;d=addDays(d,7)){const w=weekInfo(iso(d));const has=w.l||Object.values(w.r).some(v=>String(v||"").trim());if(!has)continue;
    wk.push([w.ws,w.we,H(w.l),H(w.target),w.sub,w.its,alertsText(w.alerts),w.r.worked||"",w.r.improve||"",w.r.mentor||"",w.r.focus||""])}
  const mo=[["Month","Focus","Logged (h)","Hours by Project","Budget Alerts","Wins","Improvements","Goals","Notes"]];
  for(let d=new Date(from.getFullYear(),from.getMonth(),1);iso(d)<=toS;d=new Date(d.getFullYear(),d.getMonth()+1,1)){const m=monthInfo(iso(d).slice(0,7));
    const has=m.l||m.r.focus||m.r.notes||(m.r.wins||[]).some(x=>String(x).trim())||(m.r.improve||[]).some(x=>String(x).trim())||(m.r.goals||[]).some(g=>g.g||g.w||g.r);if(!has)continue;
    mo.push([m.title,m.r.focus||"",H(m.l),Object.entries(m.per).map(([n,v])=>`${n}: ${fmtH(v)}`).join("; "),alertsText(m.alerts),(m.r.wins||[]).filter(x=>String(x).trim()).map((x,i)=>`${i+1}. ${x}`).join("\n"),(m.r.improve||[]).filter(x=>String(x).trim()).map((x,i)=>`${i+1}. ${x}`).join("\n"),(m.r.goals||[]).filter(g=>g.g||g.w||g.r).map((g,i)=>`${i+1}. ${g.g}${g.w?` — Why/How: ${g.w}`:""}${g.r?` — Reward: ${g.r}`:""}`).join("\n"),m.r.notes||""])}
  const wb=X.utils.book_new(),sh=(rows,cols)=>{const ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=cols.map(w=>({wch:w}));return ws};
  X.utils.book_append_sheet(wb,sh(wk,[12,12,10,10,15,13,28,40,40,40,40]),"Weekly");
  X.utils.book_append_sheet(wb,sh(mo,[16,36,10,30,28,40,40,50,50]),"Monthly");
  downloadFile(`${shortName()} Reviews ${TODAY()}.xlsx`,new Blob([X.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}

function mountHSV(box,hex,dark,label,onSet){
  const [h,sa,v]=rgb2hsv(...hex2rgb(hex));
  box.innerHTML=`<div class="hsv-prev ${dark?"dk":""}"><span style="background:${hex}"></span><b>${label}</b></div>
    <div class="hsv-sl"><label>Hue <span data-o="h">${h}°</span></label><input type="range" class="hr" data-r="h" min="0" max="359" value="${h}" aria-label="Hue"></div>

    <div class="hsv-sl"><label>Value <span data-o="v">${v}%</span></label><input type="range" class="hr" data-r="v" min="0" max="100" value="${v}" aria-label="Value"></div>
    <div class="hsv-sl"><label>Hex</label><input class="inp" data-r="x" value="${hex}" style="max-width:140px;text-transform:uppercase" aria-label="Hex"></div>`;
  const q=k=>box.querySelector(`[data-r="${k}"]`),H=q("h"),Sa=q("s"),V=q("v"),X=q("x");
  const paint=()=>{const h=+H.value,s2=+Sa.value,v2=+V.value;
    H.style.background=`linear-gradient(to right,${[0,60,120,180,240,300,360].map(x=>hsvHex(x%360,Math.max(s2,35),Math.max(v2,55))).join(",")})`;
    Sa.style.background=`linear-gradient(to right,${hsvHex(h,0,v2)},${hsvHex(h,100,v2)})`;V.style.background=`linear-gradient(to right,#000000,${hsvHex(h,s2,100)})`;
    box.querySelector('[data-o="h"]').textContent=h+"°";box.querySelector('[data-o="s"]').textContent=s2+"%";box.querySelector('[data-o="v"]').textContent=v2+"%"};
  const set=hex=>{box.querySelector(".hsv-prev span").style.background=hex;onSet(hex)};
  [H,Sa,V].forEach(r=>r.oninput=()=>{const hex=hsvHex(+H.value,+Sa.value,+V.value);X.value=hex;set(hex);paint()});
  X.oninput=()=>{let v=X.value.trim();if(!v.startsWith("#"))v="#"+v;if(!/^#[0-9a-fA-F]{6}$/.test(v))return;v=v.toUpperCase();const[h2,s2,v2]=rgb2hsv(...hex2rgb(v));H.value=h2;Sa.value=s2;V.value=v2;set(v);paint()};
  paint();
}

/* ===================== files ===================== */
function downloadFile(name,data,type="application/json"){const a=document.createElement("a");a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));a.download=name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E]/g,"").replace(/[\\/:*?"<>|]/g,"-");document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
const backupNow=()=>{downloadFile(`${shortName()} Backup ${TODAY()}.json`,JSON.stringify({kind:"bbst-backup",exported:new Date().toISOString(),data:docsOf(S)}));toast("Backup downloaded")};
function projectFile(p){const ids=new Set();p.phases.forEach(ph=>ph.items.forEach(it=>it.steps.forEach(st=>ids.add(st.id))));
  return {kind:"bbst-project",exported:new Date().toISOString(),project:p,sessions:S.sessions.filter(x=>ids.has(x.step)),plans:S.plans.filter(x=>ids.has(x.step))}}
function importProject(f){
  const map={},p=JSON.parse(JSON.stringify(f.project));p.id=uid();p.archived=false;
  if(S.projects.some(x=>x.name===p.name))p.name+=" (Imported)";
  p.phases.forEach(ph=>{ph.id=uid();(ph.schedule||[]).forEach(e=>e.id=uid());ph.items.forEach(it=>{it.id=uid();it.steps.forEach(st=>{const n=uid();map[st.id]=n;st.id=n})})});
  (p.schedule||[]).forEach(e=>e.id=uid());
  undoable(()=>{S.projects.push(p);(f.sessions||[]).forEach(x=>{if(map[x.step])S.sessions.push({...x,id:uid(),step:map[x.step]})});(f.plans||[]).forEach(x=>{if(map[x.step])S.plans.push({...x,id:uid(),step:map[x.step]})});S.ui.project=p.id},`${p.name} loaded`);
}
document.getElementById("upload-bk").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch(x){return toast("That file isn't a tracker backup.")}
  if(d.kind!=="bbst-backup"||!d.data)return toast("That file isn't a full tracker backup.");
  closeModal();undoable(()=>{const n=stateFrom(d.data,S.ui);["projects","templates","sessions","plans","settings","routineSkip","notes","weekly","weekMeta","monthly","itemTemplates","phaseTemplates","sounds","brand"].forEach(k=>S[k]=n[k]);ensureSettings();applyPalette();applyAdv()},"Backup restored");
});

const DEF_LOGO=(()=>{const e=document.querySelector(".brand svg");return e?e.outerHTML:""})();
function sanitizeSVG(t){
  let d;try{d=new DOMParser().parseFromString(String(t),"image/svg+xml")}catch(x){return null}
  const sv=d.documentElement;if(!sv||sv.nodeName.toLowerCase()!=="svg"||d.getElementsByTagName("parsererror").length)return null;
  sv.querySelectorAll("script,foreignObject,iframe,object,embed,audio,video,a").forEach(n=>n.remove());
  [sv,...sv.querySelectorAll("*")].forEach(n=>[...n.attributes].forEach(at=>{const v=String(at.value||"");if(/^on/i.test(at.name)||(/href$/i.test(at.name)&&!/^#/.test(v)&&!/^data:image\/(png|jpe?g|gif|webp);/i.test(v))||/javascript:/i.test(v))n.removeAttribute(at.name)}));
  if(!sv.getAttribute("viewBox")){const w=parseFloat(sv.getAttribute("width")),h=parseFloat(sv.getAttribute("height"));if(w&&h)sv.setAttribute("viewBox",`0 0 ${w} ${h}`)}
