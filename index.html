    <div class="m-actions"><button class="btn left" id="kh-edit">Edit Shortcuts</button><button class="btn primary" data-close>Close</button></div>`,a=>{a.querySelector("#kh-edit").onclick=()=>kbModal(()=>kbHelp())},"wide")}function runAction(e){const t=s=>{S.ui.view=s,commit()},a=s=>{const n=document.querySelectorAll("#view .navg button")[s];n&&n.click()};switch(e){case"newText":return newTextFor();case"viewBoard":return t("board");case"viewMonth":return t("month");case"viewWeek":return t("week");case"viewDay":return t("day");case"viewReview":return t("review");case"prev":return a(0);case"today":return a(1);case"next":return a(2);case"newBlock":{if(S.ui.view==="day"){const s=document.querySelector("[data-addblock]");s&&s.click()}else if(S.ui.view==="week"){const s=S.ui.day>=S.ui.week&&S.ui.day<=iso(addDays(parse(S.ui.week),6))?S.ui.day:S.ui.week;blockModal(null,s,540)}return}case"timerPause":{const s=document.getElementById("tm-pause");s&&s.click();return}case"timerStop":{const s=document.getElementById("tm-stop");s&&s.click();return}case"undo":return undoLast();case"projects":return libModal();case"settings":return settingsModal();case"theme":return toggleTheme();case"sync":{Sync.connected()?(toast("Syncing…"),Sync.pull("tap")):Sync.connectScreen();return}case"help":return kbHelp();case"weeklyReview":return S.ui.view="review",S.ui.rtab="weekly",S.ui.rweek=iso(weekOf(new Date)),commit();case"monthlyReview":return S.ui.view="review",S.ui.rtab="monthly",S.ui.month=TODAY().slice(0,7),commit();case"personalWeekly":return S.ui.view="review",S.ui.rtab="personal",S.ui.psub="weekly",S.ui.rweek=iso(weekOf(new Date)),commit();case"personalMonthly":return S.ui.view="review",S.ui.rtab="personal",S.ui.psub="monthly",S.ui.month=TODAY().slice(0,7),commit();case"editProject":return projectModal(proj().id,!1);case"projectNotes":{const s=proj();return notesModal("project",s,s.name)}case"backup":return backupNow();case"guide":return guideModal()}}const GUIDE={quick:[{id:"q-how",h:"How the Tracker Works",html:`
<p>Every project is split into phases, each phase holds items (a character, a page, a proposal), and each item has steps with time estimates. You start the timer on a step, and every minute it logs fills the budget bars. Your data lives in your own Google Sheet and syncs to every device.</p>
<ul>
<li>The top bar has the five pages, the sync chip (green Synced means everything reached your Sheet), today's hours against your daily target, the Light/Dark switch, Projects and Settings.</li>
<li>Almost every change shows an Undo button for a few seconds. <span class="k">Cmd/Ctrl+Z</span> works too.</li>
<li>Settings has this Guide and the version number, so you can check that each device has the latest update. When a newer version is on GitHub, an amber "Update Ready" shows next to the number. Tap it and the app reloads into the new version and opens Settings again, on the same tab, with "Updated to Version …".</li>
</ul>`},{id:"q-board",h:"Board",html:`
<p class="lead">Home base. One project at a time, with every phase as a budget bar.</p>[[fig:q-board|The Board]]
<ul>
<li>The top card shows the whole project: hours used against the budget, the value of the work, and the deadline forecast.</li>
<li>Tap a phase to open it and see its items as bars, grouped in rows. Tap an item to see its steps and start the timer.</li>
<li>Teal is time used. Yellow means a budget is past its warning point, pink means it's over. The thin line marks the estimate.</li>
<li>Notes, Edit, Client Report and + Phase sit at the top. Each open phase has + Item, Edit Phase, Notes and Feedback Rounds.</li>
<li>A Personal project (routines, reading, travel) has no budgets and never turns pink: its phases show goals and trips instead (see Personal Projects below).</li>
</ul>`},{id:"q-month",h:"Month",html:`
<p class="lead">The big picture of your month.</p>[[fig:month|Month]]
<ul>
<li>Each day shows the hours you logged and gets darker the closer you got to your daily target. Switch to Main Phase to color days by what you worked on.</li>
<li>Labels come from your project and phase schedules, plus phase target dates and project due dates.</li>
<li>Tap a day to open it. Monthly Review and a notes box for the month are on this page.</li>
</ul>`},{id:"q-week",h:"Week",html:`
<p class="lead">Plan the week and see where the time went.</p>[[fig:week|Week]]
<ul>
<li>Each day is a row. The top of the row is your plan (blocks), the thin line under it is the time the timer logged.</li>
<li>Tap empty space to add a block. Hold a block, then drag it, even to another day. Drag its right edge to resize.</li>
<li>Striped blocks are your Google Calendar events (meetups, calls). Tap one for its details and meeting link.</li>
<li>Below: Hours by Phase, Weekly Priorities, Achievements and This Week's Items (items whose target week is this week).</li>
</ul>`},{id:"q-day",h:"Day",html:`
<p class="lead">One day in a single column that fits the screen.</p>[[fig:day|Day]]
<ul>
<li>+ Block adds a block. Hold a block to drag it up or down, or hold its bottom edge to resize. Pinch to zoom the hours.</li>
<li>The thin column on the right is logged time. Tap a piece of it to fix a session.</li>
<li>On the side: planned and logged time, today's schedule (with Skip), today's items, Today's Goals (your Personal goals and any trip that day), your To-Do list and your Diary (with attachments).</li>
</ul>`},{id:"q-review",h:"Review",html:`
<p class="lead">Weekly and Monthly reviews that keep you honest, plus Personal reviews of your own.</p>[[fig:review|Weekly Review]]
<ul>
<li>Weekly Review: hours against target, items submitted, budget alerts, This Week's Focus, your Weekly Priorities and Achievements, four boxes (What Worked, What to Improve, Feedback, Next Week's Focus) and Notes.</li>
<li>Monthly Review: hours logged this month, Focus, Goals (Goal, Motivation, Rewards), This Month's Review (Wins and Improvements) and Notes.</li>
<li>Personal: a third tab with its own Weekly and Monthly reviews for your Personal projects. Work reviews never count Personal time.</li>
<li>Export turns either review into a PDF, or a range of reviews into an Excel file.</li>
</ul>`},{id:"q-personal",h:"Personal Projects",html:`
<p class="lead">Routines, reading and travel, kept apart from your work hours.</p>
<ul>
<li>Pick Personal as the project Type. It has no budgets, rates, client report or feedback rounds, and nothing in it turns pink.</li>
<li>Each phase is an activity (Meditation, Reading, Exercise) or a trip. In Edit Phase, set a gentle Goal: time (1h a Day, on the days you choose) or sessions (3 Sessions a Week, at Least 1h Each).</li>
<li>For a trip, give each place (item) Arrive and Leave dates. The phase shows the span and days, and the Month page shows each place as a band.</li>
<li>Personal time never counts toward today's ring, your daily target, the work reviews or budget alerts.</li>
</ul>`}],manual:[{id:"m1",h:"1. The Five Pages",html:`
<h4>The Top Bar</h4>
<ul>
<li>Board, Month, Week, Day and Review switch pages. Keys <span class="k">1</span> to <span class="k">5</span> do the same on a keyboard.</li>
<li>The sync chip: Synced (everything is in your Sheet), X Waiting (saved on this device, will sync), Offline (can't reach Google), Not Connected (tap to connect). Tap it anytime to sync now. After each sync the page on screen is redrawn with the newest data. If you're typing, it waits until you pause and keeps your cursor where it was, and it never closes a pop-up.</li>
<li>The ring shows hours logged today against your daily target.</li>
<li>Light/Dark switches the theme on this device. Projects opens Projects & Templates. Settings has General, Advanced, this Guide and the version.</li>
<li>On Sundays a Backup banner offers a full backup file.</li>
</ul>
<h4>Board</h4>
[[fig:board|The Board with an open phase]]
<p>The project card at the top shows the whole project. Switch projects with the menu next to Notes; it groups projects by type (Client, Internal, Pitch).</p>
<ul>
<li>The bar: teal is hours used, the light part is hours left, yellow starts at your warning threshold (80% by default), pink is over budget. The thin vertical line is the total of your step estimates.</li>
<li>Under the bar: Budget, Estimated and Actual hours. Bonus phases count toward a separate ceiling unless you include them in Settings.</li>
<li>The value line shows Estimated Value, Earned So Far and Effective Rate (see chapter 6). The forecast line shows the due date, hours left and the projected finish.</li>
<li>Client projects show the client and decision-maker. Amber chips are flags: low rate, over scope, running late, no decision-maker.</li>
</ul>
<p>Each phase card shows its own bar and value. Tap it to open it. Shift+click a phase on a laptop to open or close all of them.</p>
<ul>
<li>Inside, items sit in rows (for example Archetype A, B, C). Each item's bar is as wide as its estimate. The dot shows its status.</li>
<li>Tap a row name to rename the row.</li>
<li>Buttons: + Item, Edit Phase, Notes (a dot means it has notes or attachments), Feedback Rounds, and Hide Done once items are finished.</li>
</ul>
<h4>The Item Pop-Up</h4>
[[fig:item|An item with steps, notes and attachments]]
<ul>
<li>Tap the name to rename it. Status: Not Started, In Progress, Submitted, Feedback Received, Revising, Approved, Done. Starting the timer moves Not Started to In Progress for you.</li>
<li>Target Week puts the item in This Week's Items on the Week page.</li>
<li>Steps: each has an estimate and optional timer stages. Start runs the timer, Time Log fixes logged sessions, Edit Step changes the estimate and stages. The arrows reorder steps. Saving a new step also adds a checklist line with its name (unless that line is already there); renaming the step later leaves the line as it is.</li>
<li>Checklist and Feedback keep their own lists. Type an entry and press Enter: it's added and the box is ready for the next one. Notes has a writing box, any web addresses you type show up as tappable links under it (https://…, www.… or a short one like youtu.be/…), and Attachments sits below it. Tap a checklist line's text to edit it (Enter saves, Esc cancels), tap ✕ to delete it (with Undo), and hold the ⋮⋮ handle to drag it up or down. Tap a feedback note to edit its text or date; notes stay in date order. ✕ deletes a note (with Undo).</li>
<li>At the bottom: Delete, Move to Phase, Save as Template, Load Template and Save. Changes in an item are kept the moment you make them, so Save (or Enter, when you're not typing in a box) simply closes it, the same as Close at the top. In the Notes box, Cmd+Enter (iPad) or Ctrl+Enter saves.</li>
</ul>
<h4>Month</h4>
[[fig:month|Month, shaded by hours]]
<ul>
<li>Shade Days By: Hours vs Target (darker = closer to your daily target) or Main Phase (each day takes the color of the phase you worked on most).</li>
<li>Labels on days come from the weekly schedules you set on projects and phases. Dashed labels are phase target dates and project due dates.</li>
<li>The arrows and This Month move between months. Tap a day to open it on the Day page.</li>
<li>Show Google Events (at the left of the Shade Days By row) adds your Google Calendar events to each day. Untick it to hide them.</li>
<li>Trips from your Personal projects show as bands across their days, named at the start and at the start of each week. Tap a day to see where you are.</li>
<li>The Notes box under the calendar belongs to this month. Monthly Review opens the review for this month.</li>
</ul>
<h4>Week</h4>
[[fig:week|Week: plan above, logged time below]]
<ul>
<li>Each row is a day from Day Starts to Day Ends (5am to 10pm by default). Tap a day's name to open it.</li>
<li>Blocks: tap empty space to add one. Project Work blocks belong to a step and take its phase color. Life Blocks (meals, walks, rest) never count toward a budget. Dashed blocks come from schedules.</li>
<li>Hold a block, then drag to move it, even to another day. On a laptop, just drag. Drag the right edge to change its length.</li>
<li>Pinch the chart, or use − Fit +, to zoom the hours.</li>
<li>Striped blocks are Google Calendar events. Under each day's name: project due dates, phase target dates and all-day events (+2 means two more). Tap a striped block for its details.</li>
<li>Hours by Phase compares actual and planned time this week. Weekly Priorities (green) and Achievements (the Goals card color) are simple lists: Enter saves a line and starts the next one; Enter on an empty line finishes. They also appear in the Weekly Review. This Week's Items lists items with this target week. Hold the ⋮⋮ handle next to a line's number to drag it to a new place.</li>
</ul>
<h4>Day</h4>
[[fig:day|Day: one column for the whole day]]
<ul>
<li>The Day page remembers the date you were on, even overnight. Press T (or tap Today) to jump back to today.</li>
<li>+ Block adds a block at the current time. Hold a block and drag it up or down; hold its bottom edge to resize. Pinch or use − Fit + to zoom. The Day page always opens at Fit (the whole day on one screen); zooming in lasts while you stay on it. When a zoomed-in schedule reaches its top or bottom, keep swiping and the page scrolls on to the rest of the Day page.</li>
<li>The thin column next to the plan shows logged time. Tap a piece of it to open that step's Time Log.</li>
<li>Planned Project Time, Logged and Daily Target sit at the top of the side column.</li>
<li>The Calendar panel (Due Today when there are no events) lists the day's project due dates and phase target dates, then its Google Calendar events, with a link to join a call when the event has one (Discord, Google Meet, Zoom, Teams).</li>
<li>Schedule lists today's schedule entries; Skip removes one for this day only. Today's Items lists the items you planned blocks for.</li>
<li>Today's Goals (under Today's Items) shows each Personal goal for that day with its progress, and the trip you're on ("Oaxaca City · Day 3 of 6"). Daily goals only show on the days you chose. It's hidden when you have no Personal goals or trips.</li>
<li>To-Do (above the Diary): a checklist for the day. Type and press Enter to add (the box stays ready for the next), tick to complete, tap the text to edit, ✕ to delete (with Undo), and drag ⋮⋮ to reorder. The heading shows how many are done.</li>
<li>Unfinished to-dos are never moved without asking: today shows "2 Unfinished From Yesterday" (or from the last day that had any) with Move to Today, which moves only the unticked ones, or Leave Them.</li>
<li>Diary saves as you type. Its hint asks: What happened today? What did you learn? How do you feel? Web addresses in it show up as tappable links underneath, and Attachments under it work like Project Notes (photos of a sketchbook page, a voice memo from a call).</li>
</ul>
<h4>Google Calendar</h4>
[[fig:gcal|A Google Calendar event in the Week view]]
<ul>
<li>Turn it on in Settings > Advanced > Calendar: tick the calendars to show. Your main calendar is ticked to start.</li>
<li>Events show as striped blocks in Week and Day, and as labels in Month. They are read-only, never count toward your hours, and change only in Google Calendar.</li>
<li>Tap an event for its time, place, notes and a Join button for Discord, Google Meet, Zoom or Teams links. Open Day in Google Calendar opens that day there.</li>
<li>New events (a same-day call, say) show up the next time the tracker syncs: every 5 minutes while it's open, when you come back to it, or when you tap the sync chip.</li>
<li>The tracker keeps a copy of about 2 weeks back and 4 weeks ahead, so events still show offline. Other weeks load when you open them online.</li>
<li>Calendars from another Google account: share them with the account that holds your Sheet (Google Calendar on a computer > the calendar's Settings and Sharing > Share With Specific People > See All Event Details), accept the invitation, and they appear in the list.</li>
<li>Add to Google Calendar (on a Life Block): puts the block in your main calendar with its usual reminders. Moving the block updates the event; deleting the block or unticking the box removes it.</li>
<li>Send Due Dates to Google Calendar (on by default): project due dates and phase target dates go into a "Project Tracker Dates" calendar as all-day events. Change dates in the tracker, not there.</li>
</ul>
<h4>Review</h4>
[[fig:review|Weekly Review]]
<ul>
<li>Weekly Review: Logged vs Target, Items Submitted (items with this target week that reached Submitted or later), and the project's budget used. Budget Alerts list phases past the warning point.</li>
<li>Top to bottom: THIS WEEK'S FOCUS (faintly shows last week's Next Week's Focus until you write your own), WEEKLY PRIORITIES and ACHIEVEMENTS (the same lists as on the Week page; edit them in either place), WHAT WORKED and WHAT TO IMPROVE, FEEDBACK and NEXT WEEK'S FOCUS, then NOTES.</li>
<li>Everything saves as you type; the arrows move between weeks. Web addresses in any review box show up as tappable links under it. Both reviews' NOTES have Attachments.</li>
<li>Monthly Review, top to bottom: LOGGED THIS MONTH (in total and per project), FOCUS, GOALS (green: Goal, Motivation, Rewards), THIS MONTH'S REVIEW (pink: Wins and Improvements) and NOTES + ATTACHMENTS. In Wins and Improvements, Enter saves a line and starts the next. In Goals, Enter moves from Goal to Motivation to Rewards, then starts a new goal; Shift+Enter adds a line break. Drag ⋮⋮ to reorder.</li>
<li>Personal (the third tab, shown once you have a Personal project) has its own Weekly / Monthly switch. Personal Weekly: THIS WEEK (each goal with its day squares or session pills, time per activity, and trips), GOALS FOR THIS WEEK (faintly shows last week's Next Week's Goals until you write your own), WEEKLY PRIORITIES and ACHIEVEMENTS, WHAT WENT WELL and WHAT TO IMPROVE, NEXT WEEK'S GOALS, then NOTES + ATTACHMENTS. Personal Monthly: THIS MONTH (days or weeks each goal was met), FOCUS, GOALS (Goal, Motivation, Rewards), THIS MONTH'S REVIEW (Wins and Areas to Improve), then NOTES + ATTACHMENTS. Personal reviews are kept apart from the work reviews, and their files go to PERSONAL/2026 in Google Drive.</li>
<li>Export: Create PDF prints the review on screen (choose Save as PDF in the print window). On iPad the tracker makes the PDF file itself: tap Save or Share PDF, then Save to Files. Export Excel File saves every review in a date range. The PDF shows your text formatted (headings, bold, lists, checkboxes); the Excel file has clean text without the Markdown marks (• for bullets, ☐ / ☑ for checkboxes). File names sort in date order: REVIEW-WEEK_2026-10.12_10.18, REVIEW-MONTH_2026-10_OCT, REVIEW-3-MONTHS_2026-08_2026-10_AUG-OCT, REVIEW-YEAR_2026, and REVIEWS_FULL-REPORT_2026.10.14 for Everything. Personal PDFs are REVIEW-PERSONAL-WEEK_2026-10.12_10.18 and REVIEW-PERSONAL-MONTH_2026-10_OCT. The Excel file has four sheets: Weekly, Monthly, Personal Weekly and Personal Monthly.</li>
</ul>`},{id:"m2",h:"2. Projects, Phases and Items",html:`
<h4>Projects & Templates</h4>
[[fig:lib|Projects & Templates]]
<ul>
<li>New Blank Project, or New Project from This on a template (it copies the phases, budgets, items and steps with zero hours).</li>
<li>Filter by All, Client, Internal, Pitches or Personal. Each project has Open, Edit, Client Report (not for Personal projects), Save as Template, Download (a file with its logged time), Archive, Export Report and Delete.</li>
<li>Load from File reads a downloaded project or template.</li>
<li>Drag ⋮⋮ next to a project or template to sort its list (Projects always sit above Templates). The order syncs to every device and sets the order in the Board's project menu. With a filter on, the projects you can't see keep their places.</li>
</ul>
<h4>Edit Project</h4>
<ul>
<li>Name and Subtitle. Type: Client (paid work), Internal (your own work, like a portfolio chapter), Pitch, or Personal (routines, reading, travel: no budgets, rates or pink, and its time stays out of your work totals).</li>
<li>Client, Decision-Maker and Due Date. Feedback Rounds Included per Phase (empty uses the default in Settings).</li>
<li>Project Color: the color of the project's due date in Month, Week and Day. New projects start yellow; Default puts yellow back. Phase target dates use their phase's color.</li>
<li>Pricing (chapter 6), Weekly Schedule (labels for the calendar, optionally with a time), and Phase Order.</li>
</ul>
<h4>Phases</h4>
<ul>
<li>+ Phase on the Board, or <span class="k">Shift+Enter</span>. The cursor starts in the PHASE box, ready to type. Each phase has a name, a budget in hours, a color, an optional target date and a default item template.</li>
<li>Bonus Phase: counts toward the ceiling, not the main budget.</li>
<li>Edit Phase also has the Weekly Schedule, Order (rows and items, with a menu to move an item to another row), Send Items, Save as Template, Load Template and Delete. Delete asks for a second tap, and if the phase has notes or attached files it says so first (files go to the Google Drive Trash for 30 days), so you can move anything you want to keep.</li>
</ul>
<h4>Personal Projects: Goals and Trips</h4>
<ul>
<li>Edit Phase in a Personal project shows GOAL instead of a budget: None, Time or Sessions. Time is an amount per Day, Week or Month; a daily goal can be set for chosen days only (tap the days). Sessions means "N sessions a week, at least X each": a session is a day with at least X logged in that phase, so pausing the timer never splits one.</li>
<li>The Board shows each goal in teal: a bar for time, pills for sessions, and day squares for this week. "Goal Met 12 of 17 Days" counts the days (or weeks) so far this month; today, or a week still running, only counts once its goal is met. Going over a goal is fine, and nothing turns pink.</li>
<li>Trips: in a Personal item, TRIP DATES has Arrive and Leave. Arrive fills Leave if it's empty, and Leave can't be earlier than Arrive. Days count both ends (Nov 3 to Nov 14 is 12 days). The phase shows "Nov 3 – Nov 14 · 12 Days · 3 Places", and the project shows the trips and days away this year.</li>
<li>Personal time is left out of today's ring, Day and Week totals, the Weekly and Monthly Reviews and budget alerts. It shows in the Personal reviews instead.</li>
</ul>
<h4>Dates</h4>
<ul>
<li>Every date box you might want to empty (Due Date, Target Date, Target Week, a schedule's From and To) has a ✕ next to it. Tap ✕ to clear the date, then Save. Use it instead of the date picker's own Clear or Reset, which doesn't empty the date on every device.</li>
</ul>
<h4>Items</h4>
<ul>
<li>+ Item asks for a name and a row, and where its steps start from: an item template, a copy of the last item's steps, or no steps.</li>
<li>Save as Template (in the item pop-up) stores its steps and checklist. Load Template replaces them; logged hours are never erased.</li>
</ul>
<h4>Moving an Item to the Next Phase</h4>
<p>There are two ways, and they do different things.</p>
<ul>
<li>Send Items (Edit Phase > Send Items to Another Phase): tick the items going forward, pick the phase and the template its steps come from, and tap Send Items. Each copy keeps its name and row and starts at zero hours. The originals stay where they were, with their hours. This is the normal way to move characters from Broad Exploration into Refined Designs.</li>
<li>Move to Phase (item pop-up): moves the item itself, with its steps, notes, attachments and logged hours.</li>
<li>Linked Character Names (Settings > Advanced > Board, on by default): sent copies share one name, so renaming one renames all of them, and a character can only appear once per phase.</li>
</ul>
<h4>Phase Templates and Project Templates</h4>
<ul>
<li>Phase template (Edit Phase > Save as Template): budget, color, schedule, default item template and items. Load it into any phase.</li>
<li>Project template (Projects & Templates > Save as Template, listed under TEMPLATES): the whole project structure, ready for New Project from This. Rename it from Projects & Templates.</li>
</ul>`},{id:"m3",h:"3. The Timer",html:`
[[fig:timer|The timer bar during a stage]]
<ul>
<li>Start a step from the item pop-up, or from a block (Start Timer). Pick a stage to start from, or a standard sprint (25 + 5 by default).</li>
<li>Stages up to 90 minutes each. After each stage comes a break: 5 minutes under 45 minutes of work, 10 minutes for 45 to 89, 15 minutes for 90. After 3 hours of staged work you get a 30-minute long break. All of these are in Settings > Advanced > Timer.</li>
<li>Buttons: Pause, Finish Stage Now, Stop (logs the time so far), Skip Break, Start Next Stage. <span class="k">Space</span> pauses, <span class="k">Shift+T</span> stops.</li>
<li>Each finished stage is logged as a session. The timer survives closing the app or a reload.</li>
<li>Still Working?: after 30 minutes with no taps, the timer asks. Yes, Keep Going, or No, Remove Idle Time (logs up to your last activity).</li>
<li>Sounds: a built-in chime, or your own .mp3 or .wav up to 1 MB for Stage End, Break End and Still Working?.</li>
<li>Calendar Alerts (per device): stage-end and break-end events go into a "Project Tracker Timer" calendar, so Google Calendar alerts you even with Procreate full screen. Needs the Google Calendar app with notifications on.</li>
<li>Time Log (on each step) fixes a session's date, start and length, or deletes it. + Add Time adds work you did without the timer.</li>
</ul>`},{id:"m4",h:"4. Notes and Attachments",html:`
[[fig:notes|Phase notes with attachments]]
<h4>Notes</h4>
<ul>
<li>Projects and phases have a Notes button; items have a Notes box inside the item pop-up. Notes save as you type.</li>
<li>Every text box shows Markdown formatted when you're not typing in it: Notes, the Diary, every Weekly and Monthly Review box, the Month page notes, Goals and Feedback round notes. Type # Heading, **bold**, *italic*, - for a bullet, 1. for a numbered list, > for a quote, and - [ ] for a checkbox. Links are tappable.</li>
<li>Tap or click a box to type in it; the cursor lands where you tapped. Tap outside the box or press Esc to see it formatted again (a second Esc closes the pop-up). Tab moves into the next box on a laptop.</li>
<li>Checkboxes in a formatted box tick on a tap: "- [ ]" becomes "- [x]" in the text, and it saves like typing.</li>
<li>Shift+F (when you're not typing) switches every box, and .md files in the viewer, between Formatted and Plain. Plain shows the text as you typed it, with the box's links listed underneath. Plain is a quick peek: everything goes back to Formatted when you finish typing in a box, leave edit mode on a file, close the viewer or reopen the app.</li>
<li>Notes boxes grow with your text up to 55% of the screen (Project, Phase and Item Notes, the Diary, and the Weekly and Monthly Review NOTES), then scroll inside so the Attachments stay in view. Expand at the box's bottom corner shows the whole note; Collapse brings the limit back. Other review boxes keep growing.</li>
</ul>
<h4>Adding Files</h4>
<ul>
<li>+ Add Files: any file up to 15 MB. It's saved in Google Drive > Project Tracker Files: in the project's folder, in REVIEWS/2026 for files added to a Weekly or Monthly Review, in PERSONAL/2026 for the Personal reviews, or in DIARY/2026 for the Diary (by the year of that review or day). Each folder is made the first time it's needed. The original on your device is never changed.</li>
<li>Folder and file names the tracker makes follow one rule: no spaces, words joined with "-", parts split with "_", dates as 2026.10.12. Folders are also in capitals: SING-SONG-RETAINER, REVIEWS, PERSONAL, DIARY. Files look like Project-Tracker_Backup_2026.10.12.json. Your own file names stay as you named them.</li>
<li>Older folders (Reviews, Diary, Sing Song Retainer) are found whatever their capitals or spaces and renamed to capitals the first time they're used, so you never need to rename them yourself, and you never get a second copy.</li>
<li>+ New Note: a new note file you write in the tracker. Name it yourself (MD is the default; switch to TXT, or type .txt), optionally Add Today's Date, then write and Save (Ctrl+S / Cmd+S). It's saved on the card and in the card's Drive folder; offline it waits like any upload. Shift+N does the same in a Notes pop-up, on the Day page (Diary) and on a Review.</li>
<li>Save as MD File (under a Notes box with text): turns the notes into a file on the same card (MD by default, or TXT), then asks whether to keep or clear the box.</li>
<li>+ From Drive: files already in your Drive. Paste a Drive link, open your Project Tracker Files folders, or search your whole Drive by name, then tick files and tap Add. Nothing is copied or uploaded.</li>
<li>+ Add Link: web pages, or big files in Dropbox, Drive or Proton Drive. Drive file links become normal Drive cards automatically.</li>
<li>Offline, a new file waits on the device ("Waiting to Upload") and goes to Drive when you're back online.</li>
<li>Shrink Large Images Before Upload (Settings > Advanced > Data, this device): Off, 4,000 px or 2,500 px. JPG and PNG whose longest side is over the size are scaled down to it before going to Drive; JPG is saved again at high quality, PNG stays PNG. Smaller images and all other files go up untouched, and the original on your device never changes. Turn it Off (or pick 4,000 px) before uploading work for critique if you need full size.</li>
</ul>
<h4>Opening Files</h4>
<ul>
<li>MP3, M4A and WAV files play in the tracker's own audio player as soon as they open, offline too once saved on the device. If the iPad holds the sound back, tap the big Play button once. Back 10 and Forward 10 sit on either side, and the bar underneath jumps to any point. Keys: <span class="k">Space</span> play or pause, <span class="k">Shift+←</span> <span class="k">Shift+→</span> 10 seconds back or forward, <span class="k">M</span> mute, <span class="k">←</span> <span class="k">→</span> other files, <span class="k">Esc</span> close. Moving to another file or closing stops the sound.</li>
<li>Text files (TXT, MD, CSV, TSV, JSON, LOG) open in the viewer too, as plain text with tappable links. Markdown (.md) shows formatted: headings, bold, italic, lists, checklists, quotes, code, tables and links. The view button (or Shift+F) switches between Formatted and Plain; Plain lasts until you edit, close the file or reopen the app. Copy All matches the view: formatted text pastes with its formatting into Docs, Word or email; Plain copies the Markdown itself. + and − change the text size, Copy All copies it, and their cards show the first lines. Files over 2 MB show the first 2 MB.</li>
<li>Edit (in the viewer, or Shift+E) changes a text file: Save or Ctrl+S / Cmd+S writes it back into the same Drive file, so every card that shows it stays linked; Cancel or Esc stops editing. Save is instant: the viewer and the card show your text at once, and it goes to Google Drive in the background (the card says Saving…, then a short "saved to Google Drive" note appears). Leaving an edited file with unsaved changes (Esc, Cancel, Close, Back, or another file) asks Save Changes?: Save (highlighted, Enter), Discard, or Cancel to keep editing (a second Esc does the same). A new note asks the same before closing. If the file changed somewhere else after you opened it, your edit is saved as a copy next to it (name_Copy_date), and a note tells you. Offline, the edit is kept on the device (the card says Waiting to Save) and goes to Drive when you're back online. Dropbox links and files over 2 MB are view-only. A new note can be edited once it reaches Google Drive (a few seconds); if it's open while uploading, Edit appears by itself, and Shift+E says why when Edit isn't available. Google Drive keeps earlier versions (Manage versions).</li>
<li>JPG, PNG and PDF open in the tracker's viewer: pinch or + and − to zoom (double-click on a laptop), swipe sideways or use the arrow keys for the next file, swipe down or Close to go back (on iPad, swipe down closes images and audio only; for PDFs and text files use Close, Esc or Cmd+.).</li>
<li>Dropbox links (shared as "Anyone with the link") come through your Google Sheet's script: JPG, PNG, PDF, audio and text files open in the tracker's viewer, other files download, and they get offline copies like Drive files. On iPad, Open in Dropbox App replaces Open in Browser. A link that needs a login can only be opened in Dropbox.</li>
<li>Other files (PSD, Procreate, AI and so on), Google Docs, Sheets and Slides, and Dropbox or Proton links: the tracker asks how to open that type on this device: Open in App, Open in Browser, Download or Copy Link. Tick Remember for that type and it opens straight away next time. Change it in Settings > Advanced > Data > Link and File Actions.</li>
<li>Open in App goes straight to the right Google app: Docs, Sheets, Slides, or Drive for everything else.</li>
<li>On iPad and iPhone, Google always sends regular Drive files (PSD, Procreate and so on) to the Drive app, so those offer Open in App, Download and Copy Link only. Docs open in the browser as usual; Sheets and Slides show Google's read-only preview there. To edit, use Open in App.</li>
<li>Badges show the file type: PDF in red, images in green, PSD in dark blue, audio in black, video in violet, and DOC (blue), SHEET (green) and SLIDES (gold) for Google files. Google files show "Google Doc", "Google Sheet" or "Google Slides" instead of a size, because Google doesn't give them one.</li>
<li>Web pages (ArtStation, Pinterest and so on) always open in the browser.</li>
</ul>
<h4>The ⋯ Menu: Rename, Move, Copy, Download, Remove</h4>
[[fig:menu|The ⋯ menu and the Copy To list]]
<ul>
<li>Rename…: renames a Drive file in Google Drive and in the tracker, on every card for that file. The file type ending (.psd, .pdf) stays on if you leave it off. For links it only changes the name shown in the tracker. Renaming a Drive file needs internet. The new name shows right away while Google Drive catches up; if Drive refuses (a view-only file, or one that's gone), the old name comes back with the reason.</li>
<li>Names changed in Google Drive show up by themselves: when you open Notes or an item while online, the tracker checks Drive for the current names of its files.</li>
<li>Move To…: moves the card to Project Notes, another phase's notes or any item, or to This Week's Review, This Month's Review or Today's Diary. From a review or the Diary, it lists your projects too.</li>
<li>Files follow their card: when a file you uploaded ends up in only one place (after Move To, or after Copy To and then Remove), it moves to that place's folder in Google Drive a few seconds later (after the Undo window). While it's in two places, it stays where it is. Files added From Drive are yours and never move.</li>
<li>Copy To…: adds a second card for the same Drive file somewhere else. Both cards show 2x next to the file size. Nothing is duplicated in Drive or on your device.</li>
<li>Download as PDF (Google Docs, Sheets and Slides): your script makes the PDF. If Google won't make it, the tracker opens Google's own PDF download instead.</li>
<li>Download: Drive files up to 50 MB save to Downloads on a laptop or Android; on iPad the share sheet opens (Save to Files, or send to Photoshop or Procreate). With an offline copy it works without internet. Dropbox files up to 50 MB download the same way, through the tracker. Proton Drive links can only be opened.</li>
<li>Copy Link copies the file's link.</li>
<li>Remove (tap twice): if the file is in another place too, only this card goes. If it was the last card for a file the tracker uploaded, the file moves to the Drive trash a few seconds later (Undo first if it was a mistake). Files you added with From Drive always stay in Drive.</li>
<li>Deleting an item, phase or project moves the files the tracker uploaded for it to the Drive trash. Drive keeps trashed files for 30 days.</li>
</ul>
<h4>Order</h4>
<ul>
<li>Hold a card and drag it (on a laptop, just drag). Sort puts them in order by Name, Newest First or Oldest First; you can drag afterward.</li>
<li>The viewer's arrows and the Client Report thumbnails follow this order.</li>
</ul>
<h4>Offline Copies</h4>
<ul>
<li>Keep All Attachments Offline (Settings > Advanced > Data, per device, on by default) saves a copy of every attached Drive file on that device. The same spot shows the space used and has Clear Offline Copies. Links aren't downloaded.</li>
</ul>`},{id:"m5",h:"5. Colors",html:`
[[fig:colors|Edit Phase Colors]]
<ul>
<li>Phase Colors (Settings > General, or Edit Colors in a phase): 12 colors, each with a Light Theme and a Dark Theme version. Pick a swatch, then adjust Hue, Saturation and Value or type a hex code. Drag the ≡ handle to reorder; phases keep their colors when you do. Save as Default makes Reset to Defaults return to your set.</li>
<li>Life Block Colors work the same way for life blocks and your Daily Routine.</li>
<li>Pick a phase's color in Edit Phase, or from a Project Work block (it recolors the whole phase).</li>
<li>Appearance (Settings > Advanced): page, calendar, review and board backgrounds and cards, each for Light and Dark. Text on a light background switches automatically so it stays readable. Default resets one color. Goals + Weekly Priorities share one color (green), and This Month's Review + Achievements share another (pink).</li>
<li>Accent Color (Appearance): filled buttons like + Block, links and switches; in Dark, also today in Week and Month. Today Color (Appearance): the heading of the current day, week, month or review, and in Light also today in Week and Month (#559DD5 Light, #38B2C3 Dark by default).</li>
<li>Backup Settings / Restore Settings (Advanced > Data > BACKUP / RESTORE SETTINGS): General, Advanced and Keyboard Shortcuts in one file (no projects, connection key, logo or sounds). Restore lets you tick which parts to bring back. Keyboard Shortcuts also has its own Backup and Restore.</li>
<li>Budget Meter colors: Hours Used, Hours Left, Warning Bar, Over Budget and Warning Text. Warning Colors and Over Budget Colors can be switched off so everything stays teal.</li>
<li>Board: Phase Colors on Phase Bars and Phase Colors on Items. Off, they're teal.</li>
<li>Light/Dark in the top bar switches the theme on this device.</li>
</ul>`},{id:"m6",h:"6. Value, Rates, Rounds and Deadlines",html:`
[[fig:pricing|Edit Project: type, client and pricing]]
<h4>Rates</h4>
<ul>
<li>Settings > General > Rates and Value: Default Hourly Rate ($150), Hours per Day for day rates (6), Rate Floor, Feedback Rounds Included per Phase (1), and a second currency: Currency (MXN, JPY, CNY, EUR…) and Rate per 1 USD. Next to them: "1 MXN = 5.41% USD" (what one unit is worth in dollars) and, once you've changed the rate on a later day, "USD / MXN +2.72% Since Oct 3 2026": how much more (teal) or less (amber) your dollars buy than at your last rate. Changing the rate twice on the same day keeps the earlier comparison; a new currency starts over. Show Currency Next to USD adds that amount next to every dollar value (MX$, ¥, CN¥, €, in whole units).</li>
<li>Edit Project > Pricing: Hourly, Day Rate, Fixed Fee per Phase or Fixed Project Fee, with this project's own rate or fee. Edit Phase can set a different rate for one phase, or holds the phase fee.</li>
<li>Bill Hours Past the Budget (hourly and day rate): off by default, so hours over budget earn nothing and the effective rate drops.</li>
</ul>
<h4>What the Numbers Mean</h4>
<ul>
<li>Estimated Value: budget hours times the rate, or the fee. A project fee is split across phases by budget hours.</li>
<li>Earned So Far: billable hours times the rate, or the fee times how much of the phase is done (Approved and Done items, weighted by their estimates).</li>
<li>Effective Rate: what you actually earn per hour logged. For fixed fees, On Pace For shows the hourly rate you'll end at if the rest goes like it has so far.</li>
<li>Internal and Pitch projects show Shadow Value and Worth So Far: what the work is worth at your rate.</li>
<li>With a Rate Floor set, Client projects below it show an amber Below Your Floor chip.</li>
</ul>
<h4>Feedback Rounds</h4>
<ul>
<li>Open a phase and tap Feedback Rounds to log a round with its date and a note. When you set an item to Feedback Received, the tracker offers to log the round for you. Tap a logged round to fix its date or note; rounds stay in date order and renumber.</li>
<li>Past the included rounds, the phase shows Over Scope · Round 2 of 1. Set the number per project in Edit Project; 0 counts rounds without a limit.</li>
</ul>
<h4>Deadline Forecast</h4>
<ul>
<li>With a due date, the Board shows hours left (the larger of budget or estimate, minus what's logged, for phases not finished), the projected finish based on your last 14 days of logged time on this project, and Running Late with the daily hours you'd need. Dates outside the current year show their year (for example Apr 26, 2028).</li>
</ul>
<h4>Client Report</h4>
[[fig:creport|Client Report options]]
<ul>
<li>On the Board or in Projects: a clean PDF with phases, item status, progress, revision rounds and image thumbnails. Hours, Rates and Value, and Private Notes stay out unless you tick them. Pick the phases to include, then Create PDF.</li>
<li>On iPad the tracker makes the PDF file itself (Safari's print window is unreliable in a Home Screen app). When PDF Ready appears, tap Save or Share PDF and choose Save to Files, Mail or another app. The pages are pictures of the report, so the text can't be selected. The PDF maker downloads once while online, then works offline.</li>
<li>A file shared in several places appears once.</li>
</ul>`},{id:"m7",h:"7. Exports and Backups",html:`
<ul>
<li>Saving files on the PC: every download (backups, settings, project and template files, Excel reports, review exports, icon files, attachments from the File Viewer) opens the Windows Save As window with the name ready to edit. Pick a folder once, for example D:Storage, and Chrome opens there next time. Cancel saves nothing. If a file took a while to prepare, a small File Ready pop-up appears first: tap Save As… to choose where. On iPad and Android, files download the usual way (on Android, Chrome > Settings > Downloads > Ask Where to Save Files lets you pick the folder).</li>
<li>Excel Report (Projects > Export Report): Summary by phase (budget, estimated, actual, value, earned, effective rate, rounds), Items + Steps, and an optional Session Log.</li>
<li>Reviews: PDF of one review, or Excel of a date range (Review > Export).</li>
<li>File names follow the naming rule: Project-Tracker_Backup_2026.10.12.json, Sing-Song_Client-Report_2026.10.12.pdf, Weekly-Review_2026.10.05.pdf, Sing-Song_Time-Report_2026.10.12.xlsx.</li>
<li>Client Report: PDF (chapter 6).</li>
<li>Backup Everything (Settings > Advanced > Data > BACKUP / RESTORE EVERYTHING): one file with everything in the tracker: projects, logged time, plans, notes, reviews, templates, settings, logo and sounds. Not included: your connection key, and the attached files themselves (they stay in Google Drive, and the backup's cards still open them). The Sunday banner offers the same file.</li>
<li>Restore Everything takes the tracker back to the day of the backup you pick. Anything added since then is lost, with a few seconds to undo. It also changes your Google Sheet and your other devices, since they sync.</li>
<li>Download (Projects) saves one project with its logged time and planned blocks; Load from File brings it back as a copy.</li>
<li>Your laptop saves downloads where Chrome tells it to. To use another folder (for example D:\\DOWNLOADS), open Chrome's Settings > Downloads > Location > Change, or turn on "Ask where to save each file".</li>
</ul>
<h4>Recovering Data</h4>
<ul>
<li>Clear All Data removes your projects, logged time, plans, notes, diary and reviews from the tracker and from your Google Sheet, on every device. Settings, templates and attachment files in Drive stay.</li>
<li>Right after: tap Undo (a few seconds).</li>
<li>From a backup: Restore Everything brings back everything in the file, as it was that day.</li>
<li>From a downloaded project: Load from File brings back that project with its logged time and planned blocks, but not diary entries, reviews or month notes.</li>
<li>Last resort: in your Google Sheet, File > Version History can roll the whole Sheet back to before the change (steps below).</li>
</ul>
<h4>Recovering From Your Google Sheet</h4>
<p>Your Sheet holds the same things as a full backup, and every device copies it when it syncs.</p>
<ul>
<li>New or wiped device: open the tracker, paste your Connection Link (on a connected device: Settings > Advanced > Data > GOOGLE SHEET > Copy Connection Link), and tap Connect. Everything downloads. Without a link, use the Web App URL and the Key (Apps Script: run setupKey and read the Execution Log).</li>
<li>Data damaged or deleted: 1. Close the tracker on your other devices. 2. Open the Google Sheet > File > Version History > See Version History. 3. Pick a time before the problem and tap Restore This Version. 4. Open the tracker on each device and tap the sync chip.</li>
<li>From a file: Settings > Advanced > Data > Restore Everything, and pick a backup.</li>
</ul>`},{id:"m9",h:"8. Using It Offline",html:`
<p>The tracker opens, saves and runs the timer without internet. Changes wait on the device (the chip shows X Waiting) and sync when you're back online. When traveling where Google is blocked, that means when your VPN is on.</p>
<h4>Before You Travel</h4>
<ul>
<li>Open the installed tracker on every device while online, so the latest version is stored.</li>
<li>Export one Excel report and open one PDF attachment on each device. That stores the Excel tool and the PDF viewer for offline use.</li>
<li>Leave Keep All Attachments Offline on and let the copies download. Settings > Advanced > Data shows how many files are saved.</li>
<li>Upload big files before you go.</li>
</ul>
<h4>While Offline</h4>
<ul>
<li>Files you attach wait on the device and upload later. Files with offline copies open and download as normal.</li>
<li>Google Calendar events from the last sync (about 2 weeks back and 4 ahead) still show. Life Blocks added to Google Calendar and due-date changes go out when you're back online.</li>
<li>Calendar Alerts need internet when you start a stage. Once the events reach the device, the alerts ring offline.</li>
<li>If you edit the same project on two devices while both are offline, the last one to sync wins for that project. Logged sessions never overwrite each other.</li>
</ul>`},{id:"m11",h:"9. Advanced Settings",html:`
[[fig:adv|Settings > Advanced]]
<h4>Branding</h4>
<ul><li>App Name (header, browser tab, file names) and Home Screen Name (up to 12 characters). Upload Logo (SVG, PNG or JPG), Reset to Default, and Accent Color on SVG Logos.</li>
<li>Export Icon Files makes a zip with new home-screen icons and the name, using the icon colors you pick. Follow the instructions inside it to put them on GitHub.</li></ul>
<h4>Appearance</h4><ul><li>Background and card colors for Light and Dark, and Text Size (Small, Medium, Large).</li></ul>
<h4>Budget Meter</h4><ul><li>Budget colors, Warning Threshold (70% to 90%), Warning Colors, Over Budget Colors, Show Percentages, Week View Warnings and Budget Alerts on Review Pages.</li></ul>
<h4>Board</h4><ul><li>Phase Colors on Phase Bars, Phase Colors on Items, Include Bonus Hours in Project Totals, Linked Character Names.</li></ul>
<h4>Flags</h4><ul><li>Rate Floor Warning, Revisions Over Scope, Deadline Running Late, Missing Decision-Maker. Each switches its amber chip on or off.</li></ul>
<h4>Calendar</h4><ul><li>Week Starts On, Day Starts, Day Ends, and the 12-Hour or 24-Hour Clock.</li>
<li>Google Calendar: Show Google Calendar, the calendars to show (tick each one), and Send Due Dates to Google Calendar (chapter 1, Google Calendar).</li></ul>
<h4>Timer</h4><ul><li>Sprint presets (up to 5), break rules, Timer Sound and Volume, your own sounds, Timer Notifications, Calendar Alerts (This Device), and the Still Working? prompt with its minutes.</li></ul>
<h4>Data</h4><ul>
<li>Attachments (This Device): Keep All Attachments Offline, the files and space used, and Clear Offline Copies (tap twice). Clearing only removes copies on this device; your files stay in Drive.</li>
<li>Link and File Actions (This Device): what each file type or link does when tapped. Reset makes one ask again; Reset All (tap twice) resets every type.</li>
<li>Check Google Drive Access confirms attachments can reach Drive.</li>
<li>Clear All Data (tap twice): see Recovering Data in chapter 7.</li>
<li>BACKUP / RESTORE EVERYTHING: Backup Everything, Restore Everything and the Sunday Backup Reminder (chapter 7).</li>
<li>BACKUP / RESTORE SETTINGS: Backup Settings and Restore Settings (chapter 5).</li>
<li>Google Sheet: Copy Connection Link (for another device; treat it like a password), Show Link, Copy Sync Details and Sync Now.</li>
<li>Copy Sync Details copies a short technical log of the last 20 syncs (times, how many changes came in, errors, version and device type) for troubleshooting. It holds no notes, Diary text, project or file names.</li>
<li>Disconnect affects only the device you tap it on. That device forgets the web app URL and key and stops syncing; your Sheet and your other devices keep working, and nothing is deleted. If changes are still waiting to sync, it won't disconnect until they're sent. Reconnect by pasting your connection link. Use it when switching to another Sheet or before handing a device to someone else. If a device is lost or the link gets out, run resetKey in Apps Script instead and reconnect your devices.</li></ul>
<h4>Keyboard Shortcuts</h4><ul><li>The button at the bottom left of the Advanced tab (chapter 10).</li></ul>`},{id:"m8",h:"10. Keyboard Shortcuts",html:`

<tr><td><span class="k">+</span> <span class="k">−</span> <span class="k">0</span></td><td>Zoom in, zoom out, fit</td></tr>
<tr><td><span class="k">Esc</span> or <span class="k">Cmd/Ctrl+.</span></td><td>Close the viewer</td></tr>
<tr><td><span class="k">Shift+E</span></td><td>Edit a text file (change it in Keyboard Shortcuts)</td></tr>

</tbody></table>
<ul>
<li>The audio player keys only work while a track is open, so Space still pauses the timer everywhere else. Shortcuts never fire while you're typing in a box. On Android, Esc leaves the app (Android's own choice); use Ctrl+. or the Back swipe to close the viewer, then the pop-up.</li>
<li>Change any of them in Settings > Advanced > Keyboard Shortcuts. ✕ clears a shortcut to Empty. Extra actions start Empty: Open This Week's Review, Open This Month's Review, Open Personal Weekly Review, Open Personal Monthly Review, Edit Project, Project Notes, Backup Everything and Open the Guide.</li>
</ul>
`},{id:"m10",h:"11. Troubleshooting",html:`
<ul>
<li>"Sorry, unable to open the file at this time" (Google): you're signed into more than one Google account. Use an Incognito window with only the Sheet's account.</li>
<li>"Couldn't reach that URL": the web app URL must end in /exec, and the deployment's access must be Anyone.</li>
<li>"That key doesn't match": run setupKey in Apps Script and copy the key again.</li>
<li>"Update your Google Sheet script first": paste the newest Code.gs, run the setup it names, then Deploy > Manage deployments > New version.</li>
<li>"Google Drive access isn't allowed yet": in Apps Script, run setupDrive and approve it.</li>
<li>A device still shows an older version (Settings shows a lower Version number than your other devices). "Synced" only means your data is up to date; the app itself updates separately. If Settings shows amber "Update Ready" next to the version, tap it.<ul>
<li>Close every tracker window and tab on that device, then open it again while online.</li>
<li>Laptop: press <span class="k">Ctrl+Shift+R</span> in the tracker window, then close and reopen it.</li>
<li>iPad and Android: swipe the app closed and reopen it, twice if needed.</li>
<li>Last resort (laptop): press <span class="k">F12</span> &gt; Application &gt; Service workers &gt; Unregister, then Storage &gt; Clear site data, and reconnect with your connection link. Check that the chip says Synced first; your data comes back from your Sheet.</li></ul></li>
<li>"This Dropbox link needs a login": in Dropbox, share the file as "Anyone with the link" and add the new link. "Dropbox access isn't allowed yet": in Apps Script, run setupLinks once and approve it.</li>
<li>A Drive or Dropbox file opens a blank page on iPad: choose Open in App or Copy Link for that type (Settings > Advanced > Data > Link and File Actions). Close the blank page with the ✕ at its top left.</li>
<li>Google Calendar events don't show: check Settings > Advanced > Calendar (Show Google Calendar on, calendars ticked), then tap the sync chip. If it says calendar access isn't allowed, run setupCalendar in Apps Script.</li>
<li>A calendar from another account is missing: it has to be shared with the account that holds your Sheet, and the invitation accepted there.</li>
<li>"Too Big to Download Here": Drive files over 50 MB open in the Google Drive app instead.</li>
<li>Files named ".tracker-link-..." in Project Tracker Files > .TRACKER-TEMP: temporary copies of big Dropbox files (over 6 MB) while they come to your device in pieces. There's one per link at most; it goes to the trash when the download finishes, or after an hour if it was interrupted. They're hidden from + From Drive. Trashed files still count toward your Google storage until the trash is emptied.</li>
<li>A file stays "Waiting to Upload": it tries again by itself every 30 seconds while you're online. Go online (VPN if needed), then tap the sync chip. If it still waits, use Copy Sync Details (below).</li>
<li>Something added on another device doesn't show: check the date at the top (press T for today), then tap the sync chip. If it still doesn't show, go to Settings > Advanced > Data > Copy Sync Details on that device and paste it into a message for help.</li>
<li>Stuck pop-up or viewer: <span class="k">Esc</span>, the Close button, or the back gesture closes it.</li>
<li>A date won't clear: use the ✕ next to the date box, then Save.</li>
</ul>
<h4>Removing or Reinstalling the App</h4>
<ul>
<li>Laptop (Chrome): in the tracker's own window, click ⋮ at the top right > Uninstall. Or go to chrome://apps, right-click the tracker > Remove from Chrome. Or Windows Settings > Apps > Installed Apps > Project Tracker > Uninstall.</li>
<li>iPad: press and hold the icon > Remove App > Delete from Home Screen. Android: press and hold the icon > Uninstall (or drag it to Uninstall).</li>
<li>Your data stays in your Google Sheet. If asked whether to also clear data, either choice is fine: it only removes this device's copy and offline files.</li>
<li>To reinstall, open your tracker's address in the browser and install it again (see the setup guide). Then connect it with your connection link: on a device that's still connected, go to Settings > Advanced > Data > Copy Connection Link, send it to yourself, and open it on the reinstalled device (on iPad, paste it into the connect screen once).</li>
</ul>`},{id:"m12",h:"12. Glossary",html:`
<p>The words used in the tracker and this manual, in alphabetical order.</p>
<dl class="gloss">
<dt>2x</dt><dd>Shown next to a file&#x27;s size when the same Drive file has a card in two places (made with Copy To). Nothing is duplicated.</dd>
<dt>Accent Color</dt><dd>The tracker&#x27;s main highlight color (buttons, today&#x27;s date, links). It also tints an SVG logo when Accent Color on SVG Logos is on.</dd>
<dt>Achievements</dt><dd>What you got done this week, listed on the Week page and in the Weekly Review.</dd>
<dt>Advanced Settings</dt><dd>The second tab of Settings: Branding, Appearance, Budget Meter, Board, Flags, Calendar, Timer, Keyboard Shortcuts and Data.</dd>
<dt>Attachment Card</dt><dd>The tile for one file or link in Notes or an item: a thumbnail or badge, the name and the size. Tap it to open; hold and drag to reorder.</dd>
<dt>Audio Player</dt><dd>The tracker&#x27;s own player for MP3, M4A and WAV files, inside the File Viewer.</dd>
<dt>Backup</dt><dd>A file with everything in the tracker (Settings &gt; Advanced &gt; Data, or the Sunday Backup banner). Your Google Sheet is the main copy; a backup is the spare.</dd>
<dt>Badge</dt><dd>The colored label on an attachment card that names the file type: PDF, PSD, MP3, DOC, SHEET, SLIDES and so on.</dd>
<dt>Block</dt><dd>A planned stretch of time on Week or Day. Project Work blocks belong to a step and take its phase color.</dd>
<dt>Bonus Phase</dt><dd>A phase whose hours count toward a separate ceiling instead of the main budget, for extra work beyond the core scope.</dd>
<dt>Branding</dt><dd>The App Name, Home Screen Name, logo and home-screen icon (Settings &gt; Advanced &gt; Branding).</dd>
<dt>Budget</dt><dd>The hours a project, phase or item is allowed. The bars fill as you log time against it.</dd>
<dt>Budget Meter</dt><dd>The colors that show how full a budget is: teal for used, yellow past the warning point, pink over budget. Each can be switched off.</dd>
<dt>Checklist</dt><dd>A simple tick list inside an item. Tap a line to edit it, ✕ to delete it, ⋮⋮ to drag it.</dd>
<dt>Clear (✕)</dt><dd>The small ✕ next to a date box. It empties the date; then tap Save.</dd>
<dt>Client Report</dt><dd>A clean summary of a project to share with a client, with options for which numbers to show (Projects &gt; Client Report or the Board).</dd>
<dt>Connection Link</dt><dd>A single link that holds your web app URL and key. Opening or pasting it connects a device. Treat it like a password.</dd>
<dt>Daily Routine</dt><dd>The Life Blocks that fill in every matching day automatically (Settings &gt; General &gt; Edit Routine).</dd>
<dt>Daily Target</dt><dd>The hours you aim to log each day (6 by default). Month shades days by how close you got.</dd>
<dt>Decision-Maker</dt><dd>The person on a client project who signs off. A flag appears when a Client project has none.</dd>
<dt>Diary</dt><dd>The writing box on the Day page for notes about that day.</dd>
<dt>Drag Handle (⋮⋮)</dt><dd>The dots next to a list line. Hold and drag them to move the line up or down (checklists, Weekly Priorities, Achievements, Wins, Improvements, Goals).</dd>
<dt>Due Date</dt><dd>The date a whole project is due. It shows in the project&#x27;s color on Month, Week and Day, and drives the deadline forecast.</dd>
<dt>Effective Rate</dt><dd>What you actually earn per hour logged on a project or phase.</dd>
<dt>Estimate</dt><dd>The time you expect a step to take. Item and phase estimates add up from their steps; the thin line on a bar marks it.</dd>
<dt>Edit (Text Files)</dt><dd>The viewer button that turns a TXT, MD, CSV, TSV, JSON or LOG file into a text box. Save writes it back into the same Drive file.</dd>
<dt>Expand / Collapse</dt><dd>The small button at the bottom corner of a long Notes box: Expand shows the whole note, Collapse returns it to 55% of the screen.</dd>
<dt>Feedback Round</dt><dd>One round of client feedback on a phase. Past the rounds included, the phase shows Over Scope.</dd>
<dt>File Viewer</dt><dd>The full-screen view that opens images, PDFs, audio and text files inside the tracker, with arrows to move between files.</dd>
<dt>Files Follow Their Card</dt><dd>A file you uploaded moves in Google Drive to the folder of the one place it's shown in, after Move To or Remove. Files added From Drive never move.</dd>
<dt>Flags</dt><dd>Amber chips that warn you: Below Your Floor, Over Scope, Running Late and No Decision-Maker. Each can be switched off.</dd>
<dt>General Settings</dt><dd>The first tab of Settings: daily target, work days, Daily Routine, colors, rates and value.</dd>
<dt>Goal</dt><dd>On a phase of a Personal project: a gentle target of time or sessions per day, week or month, shown in teal. Going over is fine.</dd>
<dt>Google Events</dt><dd>Events from your Google Calendar, shown as striped blocks in Week and Day and as labels in Month.</dd>
<dt>Google Sheet</dt><dd>Your &quot;Project Tracker&quot; spreadsheet in Google Drive. It holds all your data and syncs every device.</dd>
<dt>Group</dt><dd>A row of items inside a phase, such as Archetype A or Sidekick. Items in the same group sit side by side.</dd>
<dt>Item</dt><dd>One piece of work inside a phase, such as a character, page or proposal. It holds steps, a checklist, feedback, notes and attachments.</dd>
<dt>Key</dt><dd>The password-like code that lets the tracker talk to your Google Sheet. It&#x27;s part of your connection link.</dd>
<dt>Life Block</dt><dd>A block for life outside work (meals, walks, rest). It never counts toward a budget.</dd>
<dt>Markdown</dt><dd>Simple marks for formatting plain text: # for a heading, **bold**, *italic*, - for bullets, - [ ] for checkboxes. Text boxes and .md files show it formatted; Shift+F switches to Plain.</dd>
<dt>⋯ Menu</dt><dd>The three-dot button on an attachment card: Rename, Move To, Copy To, Download (or Download as PDF), Copy Link and Remove.</dd>
<dt>Monthly Review</dt><dd>The review of a month on the Review page: hours logged, focus, goals (with motivation and rewards), This Month's Review (wins and improvements) and notes.</dd>
<dt>Naming Rule</dt><dd>How the tracker names folders and files: no spaces, words joined with "-", parts split with "_", dates as 2026.10.12. Folders are in capitals (SING-SONG-RETAINER).</dd>
<dt>New Note</dt><dd>A note file you create and write in the tracker with + New Note (or Shift+N), named by you, MD by default.</dd>
<dt>Offline Copy</dt><dd>A file saved on the device so it opens without internet. Turn on Keep All Attachments Offline to save every file.</dd>
<dt>Open in App / Open in Browser</dt><dd>The choices for opening a non-image file: in its own app (Drive, Docs, Photoshop) or in a browser tab.</dd>
<dt>Personal Project</dt><dd>A project for routines, reading or travel. No budgets, rates or pink; phases can have goals, items can have trip dates, and its time stays out of your work totals and reviews.</dd>
<dt>Personal Review</dt><dd>The third tab of the Review page, with its own Weekly and Monthly reviews of your Personal projects.</dd>
<dt>Phase</dt><dd>A stage of a project with its own budget, color, target date and items, such as Broad Exploration or Refinement.</dd>
<dt>Phase Color</dt><dd>The color of a phase&#x27;s bars, blocks and target dates, picked from your Phase Colors.</dd>
<dt>Pop-Up</dt><dd>A window that opens over the page, such as Edit Project or an item.</dd>
<dt>Project</dt><dd>The top level of your work: a client job, a portfolio chapter or a pitch. It holds phases, a budget, pricing and a due date.</dd>
<dt>Project Color</dt><dd>The color of a project&#x27;s due date on Month, Week and Day (yellow by default), set in Edit Project.</dd>
<dt>Project Tracker Dates</dt><dd>The Google calendar that holds your due dates and phase target dates as all-day events.</dd>
<dt>Project Tracker Files</dt><dd>The folder in your Google Drive where the tracker stores uploaded attachments: one folder per project, plus REVIEWS/2026, PERSONAL/2026 and DIARY/2026.</dd>
<dt>Project Type</dt><dd>Client (paid work), Internal (your own work, such as a portfolio chapter) or Pitch (a proposal you&#x27;re not paid for yet).</dd>
<dt>Projected Finish</dt><dd>The date the project would be done at your recent pace (the last 14 days of logged time).</dd>
<dt>Rate Floor</dt><dd>The lowest hourly rate you&#x27;ll accept. Client projects below it show the Below Your Floor flag.</dd>
<dt>Remember</dt><dd>The tick box that saves how a file type opens on this device, so it opens straight away next time.</dd>
<dt>Running Late</dt><dd>The flag that shows when the projected finish is after the due date, with the hours per day you&#x27;d need to catch up.</dd>
<dt>Section Header</dt><dd>The large teal title of a section, such as DAILY ROUTINE in Settings or a chapter title in this manual.</dd>
<dt>Session</dt><dd>One stretch of logged time on a step. The Time Log lists them. For a Personal sessions goal, a session is a day with at least the minimum time logged in that phase.</dd>
<dt>Trip Band</dt><dd>A colored band on the Month page across the days of a place on a trip (Arrive to Leave).</dd>
<dt>Shadow Value</dt><dd>What Internal and Pitch work would be worth at your rate, even though no one is paying for it yet.</dd>
<dt>Stage</dt><dd>A timed stretch of work within a step (up to 90 minutes), followed by a break.</dd>
<dt>Status</dt><dd>Where an item stands: Not Started, In Progress, Submitted, Feedback Received, Revising, Approved or Done.</dd>
<dt>Step</dt><dd>A task inside an item with its own time estimate, such as Sketch or Render. You run the timer on a step.</dd>
<dt>Sub-Header</dt><dd>The smaller bold title inside a section, such as &quot;The Top Bar&quot;.</dd>
<dt>Sync Chip</dt><dd>The status button in the top bar: Synced, X Waiting, Offline or Not Connected. Tap it to sync now.</dd>
<dt>Sync Details</dt><dd>A short technical log of recent syncs, copied with Copy Sync Details (Settings > Advanced > Data) to help troubleshoot.</dd>
<dt>Target Date</dt><dd>The date a phase should be done. It shows in the phase&#x27;s color on Month, Week and Day.</dd>
<dt>Target Week</dt><dd>The week an item should be done. It lists the item under This Week&#x27;s Items on Week.</dd>
<dt>Template</dt><dd>A saved starting point: an item template (steps and checklist), a phase template or a project template (a whole project, listed under TEMPLATES in Projects & Templates).</dd>
<dt>This Week&#x27;s Focus</dt><dd>The one thing a week is about, at the top of the Weekly Review.</dd>
<dt>Today Color</dt><dd>The color of the heading when you're on the current day, week, month or review (and of today in Week and Month in Light). Set it in Settings > Advanced > Appearance.</dd>
<dt>Time Log</dt><dd>The list of sessions logged on a step, where you can fix or delete them.</dd>
<dt>To-Do</dt><dd>The checklist for one day on the Day page. Unfinished ones are offered on the next day you open, with Move to Today or Leave Them.</dd>
<dt>.TRACKER-TEMP</dt><dd>A folder in Project Tracker Files where big Dropbox files wait briefly while they come to your device. Cleaned up automatically, and hidden from + From Drive.</dd>
<dt>Two-Tap Button</dt><dd>A button for something hard to undo, such as Delete or Reset All. The first tap arms it, the second tap does it.</dd>
<dt>Undo</dt><dd>The button that appears for a few seconds after most changes, or Cmd/Ctrl+Z.</dd>
<dt>Waiting</dt><dd>Changes saved on the device that haven&#x27;t reached your Google Sheet yet. They sync when you&#x27;re back online.</dd>
<dt>Warning Point</dt><dd>How full a budget gets before its bar turns yellow (80% by default).</dd>
<dt>Web App URL</dt><dd>The address of your Google Sheet&#x27;s script, ending in /exec. It&#x27;s part of your connection link.</dd>
<dt>Weekly Priorities</dt><dd>The list of what matters most this week, on the Week page and in the Weekly Review (one list, two places).</dd>
<dt>Weekly Review</dt><dd>The review of a week on the Review page: logged vs target, items submitted, budget used, This Week's Focus, Weekly Priorities, Achievements, reflections and Notes.</dd>
</dl>
